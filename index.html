let timerInterval = null;

/* ---------- 提示音 & 系统通知（专注 1 小时，人多半不在屏幕前） ---------- */
let audioCtx = null;
function chime(times){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    for(let i=0;i<times;i++){
      const at = audioCtx.currentTime + i*0.42;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(784, at);        // G5，柔和不刺耳
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.22, at+0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, at+0.38);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(at); osc.stop(at+0.4);
    }
  }catch(e){ /* 浏览器不支持音频时静默跳过 */ }
}
function notify(title, body){
  try{
    if(!("Notification" in window) || Notification.permission !== "granted") return;
    if(!document.hidden) return;   // 人就在页面上，弹层已经够了
    new Notification(title, {body, icon:"logo.svg", tag:"proudme-focus"});
  }catch(e){}
}
function askNotifyPermission(){
  try{
    if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  }catch(e){}
}

/* ---------- 每日历史（用于「我的进步」周对比） ---------- */
function bumpHistory(pomos, sec){
  const d = todayStr();
  if(!state.history[d]) state.history[d] = {p:0, s:0};
  state.history[d].p += pomos;
  state.history[d].s += sec;
  // 只保留最近 70 天，避免 localStorage 无限增长
  const keys = Object.keys(state.history).sort();
  while(keys.length > 70) delete state.history[keys.shift()];
}

/* ---------- 开始专注：先选时长，再进入全屏 ---------- */
function openStartSheet(catId, gid, preset){
  // 已有专注段在跑：直接回到专注界面，不允许同时开两个
  if(state.timer){ openFocusScreen(); return; }
  const g = (state.goals[catId]||[]).find(x=>x.id===gid);
  if(!g) return;
  // 还没写内容的格子，先让他把目标写下来再开始
  if(!(g.text||"").trim()){
    const input = document.querySelector(`.goal-row[data-gid="${gid}"] .goal-input`);
    if(input){ input.focus(); input.scrollIntoView({block:"center", behavior:"smooth"}); }
    return;
  }
  const cat = CATEGORIES.find(c=>c.id===catId);
  // 休闲类走「用积分兑换时长」的路径
  if(cat.kind === "fun"){ openFunSheet(catId, gid); return; }
  let picked = preset || state.focusMin;

  const modal = document.getElementById("startModal");
  const card  = document.getElementById("startCard");

  const paint = ()=>{
    let chips = FOCUS_OPTIONS.map(m=>
      `<button class="dur-chip${picked===m?" on":""}" data-min="${m}">${m}<small>${
        m===FOCUS_DEFAULT ? t("durRecommend") : t("durUnit")
      }</small></button>`).join("");
    chips += `<button class="dur-chip tiny${picked===STARTER_MIN?" on":""}" data-min="${STARTER_MIN}">${
      t("durStarter")}<small>${t("durStarterSub")}</small></button>`;
    card.innerHTML = `
      <div class="nav-top">
        <span class="nav-title">${t("startTitle")}</span>
        <button class="nav-close" aria-label="close">✕</button>
      </div>
      <div class="start-goal">${cat.icon} ${escapeHtml(g.text || t("goalPlaceholder"))}</div>
      <div class="start-sub">${t("startSub", picked)}</div>
      <div class="dur-chips">${chips}</div>
      <div class="start-note">${t("startNote")}</div>
      <button class="start-go">${t("startGo")}</button>`;
    card.querySelector(".nav-close").addEventListener("click", closeStartSheet);
    card.querySelectorAll(".dur-chip").forEach(b=>{
      b.addEventListener("click", ()=>{ picked = parseInt(b.dataset.min,10); paint(); });
    });
    card.querySelector(".start-go").addEventListener("click", ()=>{
      closeStartSheet();
      startFocus(catId, gid, picked);
    });
  };

  paint();
  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));
}

/* ---------- 休闲：用积分兑换一段心安理得的休息 ---------- */
function openFunSheet(catId, gid){
  if(state.timer){ openFocusScreen(); return; }
  const g = (state.goals[catId]||[]).find(x=>x.id===gid);
  if(!g) return;
  const cat = CATEGORIES.find(c=>c.id===catId);
  let picked = FUN_OPTIONS[0];

  const modal = document.getElementById("startModal");
  const card  = document.getElementById("startCard");

  const paint = ()=>{
    const avail = availablePoints();
    const cost  = picked * POINTS_PER_FUN_MIN;
    const short = Math.max(0, cost - avail);
    const chips = FUN_OPTIONS.map(m=>{
      const c = m * POINTS_PER_FUN_MIN;
      return `<button class="dur-chip fun${picked===m?" on":""}" data-min="${m}"${c>avail?" disabled":""}>${
        m}<small>${t("funCost", c)}</small></button>`;
    }).join("");
    card.innerHTML = `
      <div class="nav-top">
        <span class="nav-title">${t("funTitle")}</span>
        <button class="nav-close" aria-label="close">✕</button>
      </div>
      <div class="start-goal">${cat.icon} ${escapeHtml(g.text || t("goalPlaceholder"))}</div>
      <div class="start-sub">${t("funSub")}</div>
      <div class="start-balance"><span>${t("funBalance")}</span><b>${avail}</b></div>
      <div class="dur-chips">${chips}</div>
      ${short > 0 ? `<div class="start-short">${t("funShort", short)}</div>` : ""}
      <div class="start-note">${t("funRule")}</div>
      <button class="start-go fun"${short>0?" disabled":""}>${t("funGo", cost)}</button>`;
    card.querySelector(".nav-close").addEventListener("click", closeStartSheet);
    card.querySelectorAll(".dur-chip").forEach(b=>{
      b.addEventListener("click", ()=>{ picked = parseInt(b.dataset.min,10); paint(); });
    });
    const go = card.querySelector(".start-go");
    if(!go.disabled) go.addEventListener("click", ()=>{
      closeStartSheet();
      startFun(catId, gid, picked);
    });
  };

  paint();
  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));
}

function startFun(catId, gid, minutes){
  const cost = minutes * POINTS_PER_FUN_MIN;
  if(cost > availablePoints()) return;
  state.spent += cost;
  state.redemptions.unshift({
    emoji: CATEGORIES.find(c=>c.id===catId).icon,
    name: t("funRedeemed", minutes),
    cost, date: todayStr()
  });
  state.timer = {catId, goalId:gid, start:Date.now(), durSec:minutes*60, phase:"fun"};
  save(state);
  chime(1);
  openFocusScreen();
  render();
  startTicking();
}

function finishFun(){
  const r = settleFocus(true);
  if(!r) return;
  chime(2);
  render();
  notify(t("funOver"), t("funOverSub"));
  paintFocusScreen({done:"fun"});
}

function closeStartSheet(){
  const modal = document.getElementById("startModal");
  const card  = document.getElementById("startCard");
  card.classList.remove("show");
  setTimeout(()=>{ modal.classList.remove("open"); card.innerHTML=""; }, 200);
}

function startFocus(catId, gid, minutes){
  // 记住常规时长（起步档是临时选择，不改变默认值）
  if(FOCUS_OPTIONS.includes(minutes)) state.focusMin = minutes;
  state.timer = {catId, goalId:gid, start:Date.now(), durSec:minutes*60, phase:"focus"};
  save(state);
  askNotifyPermission();
  chime(1);                       // 顺带在用户手势里激活音频，结束时才能出声
  openFocusScreen();
  renderTasks();
  startTicking();
}

function startBreak(){
  state.timer = {catId:null, goalId:null, start:Date.now(), durSec:BREAK_MIN*60, phase:"break"};
  save(state);
  openFocusScreen();
  startTicking();
}

/* ---------- 结算一个专注段 ---------- */
// finished=true 表示走完了全程；false 表示用户中途结束
function settleFocus(finished){
  if(!state.timer) return null;
  const isFun = state.timer.phase === "fun";
  if(state.timer.phase !== "focus" && !isFun) return null;

  const {catId, goalId, durSec} = state.timer;
  const elapsed = finished ? durSec : Math.min((Date.now()-state.timer.start)/1000, durSec);
  const mins = Math.round(elapsed/60);
  // 走完全程且不短于 25 分钟，才算一个真正的番茄钟（休闲时段永远不算）
  const earnedPomo = finished && !isFun && durSec >= POMO_MIN_LEN*60;

  const g = (state.goals[catId]||[]).find(x=>x.id===goalId);
  if(g){
    g.sec = (g.sec||0) + elapsed;
    if(earnedPomo) g.pomos = (g.pomos||0) + 1;
  }
  const cat = CATEGORIES.find(c=>c.id===catId);
  state.timer = null;

  // 休闲时段不计入专注统计，也不进周对比
  if(!isFun){
    state.pomoSecEver = (state.pomoSecEver||0) + elapsed;
    if(earnedPomo) state.pomoEver = (state.pomoEver||0) + 1;
    bumpHistory(earnedPomo?1:0, elapsed);
  }

  // 有效利用时间（学习/运动/社交）累积并换算经验值
  if(cat && cat.kind !== "fun"){
    state.effSecTotal = (state.effSecTotal||0) + elapsed;
  }
  if(earnedPomo){
    state.xp += XP_PER_POMO;
    state.totalXp += XP_PER_POMO;
    // 专注段给积分，积分能换休闲时长 —— 四个板块由此形成闭环
    state.catPoints[catId] = (state.catPoints[catId]||0) + POINTS_PER_POMO;
    while(state.xp >= xpNeeded(state.level)){
      state.xp -= xpNeeded(state.level);
      state.level += 1;
    }
  }
  save(state);
  if(cat && cat.kind !== "fun") awardTimeXp();
  checkBadges();
  return {mins, earnedPomo, catId, finished, durSec, isFun};
}

// 中途结束：记录已完成的时间，回到首页
function abandonFocus(){
  const r = settleFocus(false);
  closeFocusScreen();
  render();
  if(r && r.mins >= 1){
    showToast({emoji:"⏱", msg:t("partialDone", r.mins), sub:t("partialSub")});
  }
}
// 兼容旧调用点（删除目标时需要先停止计时）
function stopTimer(){ if(state.timer && state.timer.phase === "focus") abandonFocus(); else { state.timer=null; save(state); closeFocusScreen(); } }

// 专注时间到：结算并给出休息提示
function finishFocus(){
  const r = settleFocus(true);
  if(!r) return;
  chime(2);
  render();
  if(r.earnedPomo){
    popTomato(r.catId);
    notify(t("timeUp"), t("timeUpBreak", r.mins));
    paintFocusScreen({done:"focus", mins:r.mins, pomo:true});
    spawnConfetti();
  } else {
    notify(t("starterDone"), t("starterDoneSub"));
    paintFocusScreen({done:"focus", mins:r.mins, pomo:false});
  }
}

function finishBreak(){
  state.timer = null;
  save(state);
  chime(1);
  notify(t("breakOver"), t("breakOverSub"));
  paintFocusScreen({done:"break"});
  renderTasks();
}

/* ---------- 结算后自动流转 ---------- */
// 专注结束 → 提示时间到 → 自动进入 10 分钟休息 → 休息结束 → 自动回到首页。
// 全程不需要用户点任何东西；想跳过随时可以点。
const AUTO_DELAY = 5;          // 秒
let autoTimer = null;

function clearAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
}

function startAuto(seconds, labelKey, onDone){
  clearAuto();
  let left = seconds;
  const paint = ()=>{
    const el = document.getElementById("fsAuto");
    if(el) el.textContent = t(labelKey, left);
  };
  paint();
  autoTimer = setInterval(()=>{
    left -= 1;
    if(left <= 0){ clearAuto(); onDone(); return; }
    paint();
  }, 1000);
}

// 回到首页：把计时清干净再关屏
function backHome(){
  clearAuto();
  state.timer = null;
  save(state);
  closeFocusScreen();
  render();
}

/* ---------- 全屏专注界面 ---------- */
const RING_LEN = 2 * Math.PI * 104;   // 与 svg 里 r=104 对应

function openFocusScreen(){
  document.getElementById("focusScreen").classList.add("open");
  paintFocusScreen(null);
}
function closeFocusScreen(){
  clearAuto();
  document.getElementById("focusScreen").classList.remove("open");
}

// mode=null 正常进行中；{done:"focus"|"break"} 结算态
function paintFocusScreen(mode){
  const scr   = document.getElementById("focusScreen");
  if(!scr.classList.contains("open")) return;
  const elCat = document.getElementById("fsCat");
  const elGoal= document.getElementById("fsGoal");
  const elTime= document.getElementById("fsTime");
  const elPh  = document.getElementById("fsPhase");
  const elOf  = document.getElementById("fsOf");
  const elHint= document.getElementById("fsHint");
  const elBtns= document.getElementById("fsBtns");
  const elProg= document.getElementById("fsProg");
  elProg.setAttribute("stroke-dasharray", RING_LEN.toFixed(2));

  // ---- 结算态：专注段刚结束 ----
  // 长句一律放在环外的 fs-hint 里，环内只留大图标和一行极短的数字
  if(mode && mode.done === "focus"){
    scr.classList.remove("brk");
    elCat.textContent = "";
    elGoal.textContent = mode.pomo ? t("pomoDone") : t("starterDone");
    elTime.textContent = mode.pomo ? "🍅" : "👍";
    elPh.textContent   = t("fsOf", mode.mins);
    elOf.textContent   = mode.pomo ? t("pomoPoints", POINTS_PER_POMO) : "";
    elProg.setAttribute("stroke-dashoffset", "0");
    if(mode.pomo){
      elHint.innerHTML = `${escapeHtml(t("pomoDoneSub", mode.mins))}<br>${escapeHtml(t("fsHintBreak"))}`
                       + `<div class="fs-auto" id="fsAuto"></div>`;
      elBtns.innerHTML = `<button class="fs-btn go" data-act="brk">${t("fsBreakNow")}</button>
                          <button class="fs-btn ghost" data-act="close">${t("fsSkipBreak")}</button>`;
      bindFsBtns();
      startAuto(AUTO_DELAY, "fsAutoBreak", startBreak);
    } else {
      // 5 分钟起步段太短，不需要休息，倒数后直接回首页
      elHint.innerHTML = escapeHtml(t("starterDoneSub")) + `<div class="fs-auto" id="fsAuto"></div>`;
      elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
      bindFsBtns();
      startAuto(AUTO_DELAY, "fsAutoHome", backHome);
    }
    return;
  }
  // ---- 结算态：休闲时间用完 ----
  if(mode && mode.done === "fun"){
    scr.classList.remove("brk"); scr.classList.add("fn");
    elCat.textContent  = "";
    elGoal.textContent = t("funOver");
    elTime.textContent = "⏰";
    elPh.textContent   = "";
    elOf.textContent   = "";
    elProg.setAttribute("stroke-dashoffset", "0");
    elHint.innerHTML = escapeHtml(t("funOverSub")) + `<div class="fs-auto" id="fsAuto"></div>`;
    elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
    bindFsBtns();
    startAuto(AUTO_DELAY, "fsAutoHome", backHome);
    return;
  }
  // ---- 结算态：休息刚结束 ----
  if(mode && mode.done === "break"){
    scr.classList.add("brk");
    elCat.textContent = "";
    elGoal.textContent = t("breakOver");
    elTime.textContent = "☕";
    elPh.textContent   = "";
    elOf.textContent   = "";
    elProg.setAttribute("stroke-dashoffset", "0");
    elHint.innerHTML = escapeHtml(t("breakOverSub")) + `<div class="fs-auto" id="fsAuto"></div>`;
    elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
    bindFsBtns();
    startAuto(AUTO_DELAY, "fsAutoHome", backHome);
    return;
  }

  // ---- 进行中 ----
  const tm = state.timer;
  if(!tm){ closeFocusScreen(); return; }
  clearAuto();
  const isBreak = tm.phase === "break";
  const isFun   = tm.phase === "fun";
  scr.classList.toggle("brk", isBreak);
  scr.classList.toggle("fn", isFun);

  const remain = phaseRemain();
  const mm = Math.floor(remain/60), ss = Math.floor(remain%60);
  elTime.textContent = `${mm}:${ss<10?"0":""}${ss}`;
  elProg.setAttribute("stroke-dashoffset", (RING_LEN * (1 - remain/tm.durSec)).toFixed(2));

  if(isFun){
    const cat = CATEGORIES.find(c=>c.id===tm.catId);
    const g = (state.goals[tm.catId]||[]).find(x=>x.id===tm.goalId);
    elCat.textContent  = cat ? `${cat.icon} ${L(cat.title)}` : "";
    elGoal.textContent = g ? (g.text || t("funPhase")) : t("funPhase");
    elPh.textContent   = t("funPhase");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = t("funHint");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="give">${t("fsGiveUp")}</button>`;
  } else if(isBreak){
    elCat.textContent  = "";
    elGoal.textContent = t("fsBreakTitle");
    elPh.textContent   = t("fsBreak");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = t("fsHintBreak");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="close">${t("fsSkipBreak")}</button>`;
  } else {
    const cat = CATEGORIES.find(c=>c.id===tm.catId);
    const g = (state.goals[tm.catId]||[]).find(x=>x.id===tm.goalId);
    elCat.textContent  = cat ? `${cat.icon} ${L(cat.title)}` : "";
    elGoal.textContent = g ? (g.text || t("goalPlaceholder")) : "";
    elPh.textContent   = t("fsFocus");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = tm.durSec <= STARTER_MIN*60 ? t("fsHintStarter") : t("fsHintFocus");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="give">${t("fsGiveUp")}</button>`;
  }
  bindFsBtns();
}

function bindFsBtns(){
  document.querySelectorAll("#fsBtns .fs-btn").forEach(b=>{
    b.onclick = ()=>{
      const a = b.dataset.act;
      clearAuto();                       // 用户自己动手了，就别再自动跳
      if(a === "give")       abandonFocus();
      else if(a === "brk")   startBreak();
      else if(a === "close") backHome();
    };
  });
}

// 根据累计有效利用时间发放经验值（每小时 +10 XP），让角色等级与有效投入时间挂钩
function awardTimeXp(){
  const earnable = Math.floor(state.effSecTotal / SECONDS_PER_XP);
  const delta = earnable - state.timeXpAwarded;
  if(delta > 0){
    state.timeXpAwarded = earnable;
    state.xp += delta;
    state.totalXp += delta;
    let leveledUp = false;
    while(state.xp >= xpNeeded(state.level)){
      state.xp -= xpNeeded(state.level);
      state.level += 1;
      leveledUp = true;
    }
    save(state);
    showToast({emoji:"⏱", msg:t("timeXpToast", delta), sub:t("timeXpSub")});
    if(leveledUp){
      const stage = getStage(state.level);
      setTimeout(()=>showToast({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true}), 1600);
    }
    checkBadges();
  }
}

/* ===================== 积分 & 兑换（弹层内容） ===================== */

function buildRewards(el){
  const total = totalPoints();

  // 计分类别的积分明细（娱乐不计分，不显示）
  let breakdown = "";
  CATEGORIES.filter(c=>c.kind!=="fun").forEach(c=>{
    breakdown += `<span class="pt-cat">${c.icon}${state.catPoints[c.id]||0}</span>`;
  });

  // 兑换记录
  let rows = "";
  if(state.redemptions.length === 0){
    rows = `<div class="redeem-empty">${t("redeemEmpty")}</div>`;
  } else {
    state.redemptions.forEach(r=>{
      rows += `
        <div class="redeem-row">
          <span class="r-ic">${r.emoji}</span>
          <span class="r-name">${r.name}</span>
          <span class="r-meta">${r.date}<br><span class="r-cost">${t("costUnit", r.cost)}</span></span>
        </div>`;
    });
  }

  // 心愿奖励清单：积分的另一个出口（现实里的奖励，找家长兑现）
  const avail = availablePoints();
  let wishes = "";
  state.wishList.forEach(w=>{
    const afford = avail >= w.cost;
    wishes += `
      <div class="wish-item">
        <span class="w-ic">${w.emoji}</span>
        <span class="w-info">
          <span class="w-name">${escapeHtml(typeof w.name === "object" ? L(w.name) : w.name)}</span>
          <span class="w-cost">${t("funCost", w.cost)}</span>
        </span>
        <button class="redeem-btn" data-wish="${w.id}"${afford?"":" disabled"}>${t("wishRedeem")}</button>
        <button class="w-del" data-wish-del="${w.id}" aria-label="delete">✕</button>
      </div>`;
  });

  el.innerHTML = navHeader("rewardsTitle") + `
    <div class="points-head">
      <span class="pt-total">${t("pointsTotalLabel", total)}</span>
      <span class="pt-avail">${t("availLabel", avail)}</span>
    </div>
    <div class="pt-breakdown">${breakdown}</div>
    <div class="rules-box">${escapeHtml(t("redeemRules")).replace(/\n/g,"<br>")}</div>
    <div class="sub-head">${t("wishListHead")}</div>
    ${wishes}
    <div class="wish-add">
      <input class="n" data-wish-name placeholder="${t("wishAddName")}" maxlength="16">
      <input class="c" data-wish-cost type="number" min="1" step="1" placeholder="${t("wishAddCost")}">
      <button data-wish-add>${t("wishAdd")}</button>
    </div>
    <div class="sub-head">${t("redeemTitle")}</div>
    ${rows}
  `;

  el.querySelectorAll("[data-wish]").forEach(b=>{
    b.addEventListener("click", ()=>redeemWish(b.dataset.wish));
  });
  el.querySelectorAll("[data-wish-del]").forEach(b=>{
    b.addEventListener("click", ()=>{
      state.wishList = state.wishList.filter(w=>w.id !== b.dataset.wishDel);
      save(state); refreshNav();
    });
  });
  el.querySelector("[data-wish-add]").addEventListener("click", ()=>{
    const nameEl = el.querySelector("[data-wish-name]");
    const costEl = el.querySelector("[data-wish-cost]");
    const name = nameEl.value.trim();
    const cost = parseInt(costEl.value, 10);
    if(!name || !(cost > 0)) return;
    state.wishList.push({id:uid("w"), emoji:"🎁", name, cost});
    save(state); refreshNav();
  });
}

function redeemWish(id){
  const w = state.wishList.find(x=>x.id === id);
  if(!w || availablePoints() < w.cost) return;
  state.spent += w.cost;
  state.redemptions.unshift({
    emoji: w.emoji,
    name: typeof w.name === "object" ? L(w.name) : w.name,
    cost: w.cost,
    date: todayStr()
  });
  save(state);
  refreshNav();
  spawnConfetti();
  showToast({emoji:"🎁", msg:t("redeemDone", typeof w.name === "object" ? L(w.name) : w.name), sub:t("redeemDoneSub")});
}

function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.unlockedBadges.includes(b.id) && b.need(state)){
      state.unlockedBadges.push(b.id);
      setTimeout(()=>showToast({emoji:b.icon, msg:t("newBadge"), sub:L(b.name), levelup:true}), 700);
    }
  });
}

function completeGoal(catId, goal){
  const cat = CATEGORIES.find(c=>c.id===catId);

  // 娱乐类目标：仅打卡记录，不计积分、不发经验、不触发奖励小游戏
  if(cat.kind === "fun"){
    save(state);
    renderTasks();
    return;
  }

  // 学习/运动/社交目标：该类别 +10 分（总积分 = 三类之和），同时 +10 经验值
  state.catPoints[catId] = (state.catPoints[catId]||0) + POINTS_PER_GOAL;
  state.xp += POINTS_PER_GOAL;
  state.totalXp += POINTS_PER_GOAL;

  let leveledUp = false;
  while(state.xp >= xpNeeded(state.level)){
    state.xp -= xpNeeded(state.level);
    state.level += 1;
    leveledUp = true;
  }

  const today = todayStr();
  if(state.lastCompleteDate !== today){
    const yesterday = yesterdayStr();
    state.streak = (state.lastCompleteDate === yesterday) ? state.streak + 1 : 1;
    state.lastCompleteDate = today;
  }

  // 全勤：每个类别都有目标且全部完成
  const allDone = CATEGORIES.every(c => {
    const gs = state.goals[c.id] || [];
    return gs.length > 0 && gs.every(g=>g.done);
  });
  if(allDone) state.allDoneEver = true;

  save(state);
  render();
  pulseAvatar();
  spawnConfetti();

  const pick = ENCOURAGEMENTS[Math.floor(Math.random()*ENCOURAGEMENTS.length)];
  showToast({emoji:pick.emoji, msg:L(pick.msg), sub:L(pick.sub)});

  const pendingToasts = [];
  if(leveledUp){
    const stage = getStage(state.level);
    pendingToasts.push({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true});
  }
  checkBadgesQuiet(pendingToasts);
  if(allDone){
    pendingToasts.push({emoji:"🏆", msg:t("perfectDay"), sub:t("perfectDaySub"), levelup:true});
  }

  setTimeout(()=>{
    launchMiniGame(cat, (bonusXp)=>{
      if(bonusXp > 0){
        applyBonusXp(bonusXp);
      }
      showToastSequence(pendingToasts);
    });
  }, 1300);
}

function applyBonusXp(amount){
  state.xp += amount;
  state.totalXp += amount;
  let leveledUp = false;
  while(state.xp >= xpNeeded(state.level)){
    state.xp -= xpNeeded(state.level);
    state.level += 1;
    leveledUp = true;
  }
  save(state);
  render();
  if(leveledUp){
    const stage = getStage(state.level);
    showToast({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true});
  }
  checkBadges();
}

function checkBadgesQuiet(pendingToasts){
  let changed = false;
  BADGES.forEach(b=>{
    if(!state.unlockedBadges.includes(b.id) && b.need(state)){
      state.unlockedBadges.push(b.id);
      pendingToasts.push({emoji:b.icon, msg:t("newBadge"), sub:L(b.name), levelup:true});
      changed = true;
    }
  });
  if(changed){ save(state); render(); }
}

function showToastSequence(list){
  if(!list.length) return;
  let delay = 0;
  list.forEach(t=>{
    setTimeout(()=>showToast(t), delay);
    delay += 1600;
  });
}

function pulseAvatar(){
  const av = document.getElementById("avatar");
  av.classList.remove("pulse");
  void av.offsetWidth;
  av.classList.add("pulse");
}

function showToast(opt){
  const wrap = document.getElementById("toast");
  const card = document.createElement("div");
  card.className = "toast-card" + (opt.levelup ? " levelup-card" : "");
  card.innerHTML = `
    <div class="toast-emoji">${opt.emoji}</div>
    <div class="toast-msg">${opt.msg}</div>
    <div class="toast-sub">${opt.sub}</div>
  `;
  wrap.innerHTML = "";
  wrap.appendChild(card);
  requestAnimationFrame(()=>card.classList.add("show"));
  setTimeout(()=>{
    card.classList.remove("show");
    setTimeout(()=>{ if(wrap.contains(card)) wrap.removeChild(card); }, 300);
  }, 1500);
}

function spawnConfetti(){
  const colors = ["#ff8c42","#7bd389","#a78bfa","#ffd166","#4cc9f0"];
  const av = document.getElementById("avatar");
  const rect = av.getBoundingClientRect();
  for(let i=0;i<14;i++){
    const dot = document.createElement("div");
    dot.className = "confetti";
    dot.style.left = (rect.left + rect.width/2 + (Math.random()*60-30)) + "px";
    dot.style.top = (rect.top + rect.height/2) + "px";
    dot.style.background = colors[Math.floor(Math.random()*colors.length)];
    dot.style.position = "fixed";
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(), 1200);
  }
}

document.querySelectorAll(".lang-toggle button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    render();
  });
});

/* ===================== 小游戏奖励关卡 ===================== */

// 每个类别对应一个专属小游戏
const GAME_FN = {
  math: renderMathQuiz,        // 学习 → 速算闯关（需要专注思考）
  piano: renderPianoTiles,     // 运动 → 节奏方块（快速敲击、活力满满）
  memory: renderMemorySequence,// 娱乐 → 记忆序列
  reflex: renderReflexTest,    // 社交 → 极速反应（快速回应、临场反应）
};

function launchMiniGame(category, onClose){
  const modal = document.getElementById("gameModal");
  const card = document.getElementById("gameCard");
  const pick = GAME_FN[category.game] || renderMathQuiz;

  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));

  function close(bonusXp){
    card.classList.remove("show");
    setTimeout(()=>{
      modal.classList.remove("open");
      card.innerHTML = "";
      onClose(bonusXp);
    }, 250);
  }

  pick(card, category, close);
}

function starsToXp(stars){ return stars * 10; }

function showGameResult(card, stars, title){
  const bonus = starsToXp(stars);
  const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  card.innerHTML = `
    <div class="game-result">
      <div class="game-title">${title}</div>
      <div class="stars">${starStr}</div>
      <div class="bonus">${bonus > 0 ? t("bonusXp", bonus) : t("tryAgain")}</div>
      <button class="start-game-btn" id="resultCloseBtn">${t("great")}</button>
    </div>
  `;
  document.getElementById("resultCloseBtn").addEventListener("click", ()=>{
    card._onFinish(bonus);
  });
}

function renderPianoTiles(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="pianoExitBtn">✕</button>
    <div class="game-title">${t("pianoTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("pianoSub")}</div>
    <div class="game-hud"><span id="pianoScore">🎯 0</span><span id="pianoTimer">⏱ 15s</span></div>
    <div class="game-area"><div class="lane-area" id="pianoLanes"></div></div>
  `;
  const lanesWrap = document.getElementById("pianoLanes");
  const scoreEl = document.getElementById("pianoScore");
  const timerEl = document.getElementById("pianoTimer");
  const LANE_COUNT = 4;
  const lanes = [];
  for(let i=0;i<LANE_COUNT;i++){
    const lane = document.createElement("div");
    lane.className = "lane";
    lanesWrap.appendChild(lane);
    lanes.push(lane);
  }
  const hitZone = document.createElement("div");
  hitZone.className = "hit-zone";
  lanesWrap.appendChild(hitZone);

  let score = 0;
  let spawned = 0;
  let timeLeft = 15;
  let running = true;
  let speed = 1.5;

  document.getElementById("pianoExitBtn").addEventListener("click", ()=>{
    running = false;
    clearInterval(spawnHandle);
    clearInterval(timerHandle);
    close(0);
  });

  function spawnTile(){
    if(!running) return;
    spawned += 1;
    const laneIdx = Math.floor(Math.random()*LANE_COUNT);
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.style.animationDuration = speed + "s";
    lanes[laneIdx].appendChild(tile);

    tile.addEventListener("click", ()=>{
      if(tile.dataset.gone) return;
      tile.dataset.gone = "1";
      score += 1;
      scoreEl.textContent = "🎯 " + score;
      tile.classList.add("tapped");
      tile.style.transition = "opacity .15s";
      tile.style.opacity = "0";
      setTimeout(()=>tile.remove(), 150);
    });
    tile.addEventListener("animationend", ()=>{ if(tile.parentNode) tile.remove(); });
  }

  const spawnHandle = setInterval(spawnTile, 480);
  const speedHandle = setInterval(()=>{ speed = Math.max(0.8, speed - 0.1); }, 3000);
  const timerHandle = setInterval(()=>{
    timeLeft -= 1;
    timerEl.textContent = "⏱ " + timeLeft + "s";
    if(timeLeft <= 0){
      running = false;
      clearInterval(spawnHandle);
      clearInterval(speedHandle);
      clearInterval(timerHandle);
      const accuracy = spawned > 0 ? score/spawned : 0;
      let stars = 0;
      if(score >= 16 && accuracy >= 0.6) stars = 3;
      else if(score >= 10) stars = 2;
      else if(score >= 4) stars = 1;
      setTimeout(()=>showGameResult(card, stars, t("pianoEnd")), 400);
    }
  }, 1000);
}

function renderReflexTest(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="reflexExitBtn">✕</button>
    <div class="game-title">${t("reflexTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("reflexSub")}</div>
    <div class="game-area" id="reflexArea">
      <div class="reflex-box" id="reflexBox">
        <div class="reflex-main" id="reflexMain">${t("reflexStart")}</div>
        <div class="reflex-sub" id="reflexSub">${t("reflexRoundsInfo")}</div>
      </div>
    </div>
    <div class="reflex-rounds" id="reflexRounds">
      <div class="reflex-dot"></div><div class="reflex-dot"></div><div class="reflex-dot"></div>
    </div>
  `;
  const box = document.getElementById("reflexBox");
  const main = document.getElementById("reflexMain");
  const sub = document.getElementById("reflexSub");
  const dots = document.querySelectorAll("#reflexRounds .reflex-dot");

  let round = 0;
  let waitTimeout = null;
  let goTime = 0;
  let phase = "idle"; // idle -> waiting -> go
  const times = [];

  document.getElementById("reflexExitBtn").addEventListener("click", ()=>{
    if(waitTimeout) clearTimeout(waitTimeout);
    close(0);
  });

  function startRound(){
    phase = "waiting";
    box.className = "reflex-box";
    main.textContent = t("reflexWaiting");
    sub.textContent = t("reflexRound", round+1);
    const delay = 800 + Math.random()*1800;
    waitTimeout = setTimeout(()=>{
      phase = "go";
      goTime = Date.now();
      box.classList.add("go");
      main.textContent = t("reflexGo");
      sub.textContent = "";
    }, delay);
  }

  box.addEventListener("click", ()=>{
    if(phase === "idle"){
      startRound();
      return;
    }
    if(phase === "waiting"){
      clearTimeout(waitTimeout);
      box.classList.add("early");
      main.textContent = t("reflexEarly");
      sub.textContent = t("reflexEarlySub");
      times.push(1000);
      advanceRound();
      return;
    }
    if(phase === "go"){
      const rt = Date.now() - goTime;
      times.push(rt);
      main.textContent = rt + " ms";
      sub.textContent = t("reflexNice");
      advanceRound();
    }
  });

  function advanceRound(){
    dots[round].classList.add("done");
    round += 1;
    phase = "idle";
    if(round >= 3){
      const avg = times.reduce((a,b)=>a+b,0) / times.length;
      let stars = 0;
      if(avg <= 350) stars = 3; else if(avg <= 550) stars = 2; else if(avg <= 800) stars = 1;
      setTimeout(()=>showGameResult(card, stars, t("reflexAvg", Math.round(avg))), 900);
    } else {
      setTimeout(startRound, 900);
    }
  }
}

function renderMemorySequence(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="seqExitBtn">✕</button>
    <div class="game-title">${t("seqTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("seqSub")}</div>
    <div class="game-area">
      <div class="seq-grid" id="seqGrid">
        <div class="seq-pad p0" data-pad="0"></div>
        <div class="seq-pad p1" data-pad="1"></div>
        <div class="seq-pad p2" data-pad="2"></div>
        <div class="seq-pad p3" data-pad="3"></div>
      </div>
    </div>
    <div class="seq-status" id="seqStatus">${t("seqRound", 1)}</div>
  `;
  const pads = card.querySelectorAll(".seq-pad");
  const statusEl = document.getElementById("seqStatus");

  let sequence = [];
  let round = 0;
  let inputIdx = 0;
  let accepting = false;
  let timeouts = [];
  let finished = false;

  function clearTimers(){ timeouts.forEach(clearTimeout); timeouts = []; }

  document.getElementById("seqExitBtn").addEventListener("click", ()=>{
    finished = true;
    clearTimers();
    close(0);
  });

  function flash(idx, on){
    pads[idx].classList.toggle("lit", on);
  }

  function playSequence(){
    accepting = false;
    statusEl.textContent = t("seqWatch");
    let delay = 500;
    sequence.forEach(padIdx=>{
      timeouts.push(setTimeout(()=>flash(padIdx, true), delay));
      timeouts.push(setTimeout(()=>flash(padIdx, false), delay+420));
      delay += 620;
    });
    timeouts.push(setTimeout(()=>{
      if(finished) return;
      accepting = true;
      inputIdx = 0;
      statusEl.textContent = t("seqYourTurn");
    }, delay));
  }

  function nextRound(){
    round += 1;
    sequence.push(Math.floor(Math.random()*4));
    statusEl.textContent = t("seqRound", round);
    timeouts.push(setTimeout(playSequence, 700));
  }

  function endGame(){
    finished = true;
    accepting = false;
    clearTimers();
    const reached = round - 1; // 最后一关失败，已稳过的关数
    let stars = 0;
    if(reached >= 5) stars = 3; else if(reached >= 3) stars = 2; else if(reached >= 1) stars = 1;
    setTimeout(()=>showGameResult(card, stars, t("seqEnd", Math.max(reached,0))), 600);
  }

  pads.forEach(pad=>{
    pad.addEventListener("click", ()=>{
      if(!accepting || finished) return;
      const idx = parseInt(pad.dataset.pad,10);
      flash(idx, true);
      setTimeout(()=>flash(idx,false), 180);
      if(idx === sequence[inputIdx]){
        inputIdx += 1;
        if(inputIdx >= sequence.length){
          accepting = false;
          nextRound();
        }
      } else {
        statusEl.textContent = t("seqWrong");
        endGame();
      }
    });
  });

  nextRound();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 最近 n 天里有几天是低落类心情
function recentLowCount(n){
  let c = 0;
  for(let i=0;i<n;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const rec = state.moods[dateKey(d)];
    if(rec){ const m = moodById(rec.m); if(m && m.low) c++; }
  }
  return c;
}

function setMood(id){
  state.moods[todayStr()] = {m:id, at:Date.now()};
  // 只留最近 70 天
  const keys = Object.keys(state.moods).sort();
  while(keys.length > 70) delete state.moods[keys.shift()];
  save(state);
  refreshNav();
  const m = moodById(id);
  if(m && !m.low) spawnConfetti();
}

/* ---------- 什么时候提醒去写求助名单 ---------- */
// 原则：趁心情好的时候提，语气要像"存个紧急联系人"这么平常。
// 第一次选到低落就弹求助设置，会让人觉得是在说"你有问题"。
function shouldPromptSupport(){
  if(state.support.length > 0) return false;      // 已经写过了
  if(state.supPromptOff) return false;            // 用户说过不用了
  if(state.supPromptShown >= 3) return false;     // 最多提三次
  if(state.supPromptDate === todayStr()) return false;  // 今天提过了
  // 用过几天之后再提，别一上来就谈这个
  const moodDays = Object.keys(state.moods).length;
  return moodDays >= 2;
}

function markSupportPrompted(){
  state.supPromptShown = (state.supPromptShown||0) + 1;
  state.supPromptDate = todayStr();
  save(state);
}

// 宁可偶尔误判（那句提示本身无害），也不想漏掉真正需要的时候。
const CRISIS_HINTS = [
  "不想活","活不下去","想自杀","自杀","自残","割腕","结束生命","不想活了","没意思活着",

      </div>
      <div class="j-hint">${t("jHint")}</div>

  card.querySelector(".nav-close").addEventListener("click", closeChat);

// 提示语跟着今天的心情走
function journalPrompt(m){
  if(!m) return t("jPromptNone");
  return m.low ? t("jPromptLow") : t("jPromptGood");
}

function finishJournal(text, keep){
  const body = (text||"").trim();
  if(!body){ closeChat(); return; }
  const m = todayMood();
  const crisis = looksLikeCrisis(body);

  if(keep){
    state.journal.unshift({
      id: uid("j"),
      d: todayStr(), m: m ? m.id : null, t: body, at: Date.now()
    });
    while(state.journal.length > JOURNAL_MAX) state.journal.pop();
    save(state);
  }

  // 写完之后，让小暖认真接住这件事 —— 但不假装读懂了内容
  const card = document.getElementById("chatCard");
  card.innerHTML = `
    <div class="chat-top">
      <div class="buddy-avatar">${buddySvg()}</div>
      <span class="ct-name">${buddyName()}<small>${buddyRole()}</small></span>
      <button class="nav-close" aria-label="close">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-opts" id="chatOpts"></div>
    <div class="chat-note">${t("buddyDisclaimer", buddyName())}</div>`;
  card.querySelector(".nav-close").addEventListener("click", closeChat);

  const lines = [
    {text: keep ? t("jSavedSay") : t("jBuriedSay")},
    {text: t("jSavedSay2")},
  ];
  if(crisis){
    lines.push({text: t("jCrisisSay")});
    lines.push({text: careCard(), cls:"care"});
    if(state.careShown !== todayStr()){ state.careShown = todayStr(); save(state); }
  }
  playLines(lines, crisis
    ? [{label:t("optOk"), act:"close"}]
    : [
        {label:t("optSeeGoals"), next:"goals"},
        {label:t("jReadBack"), next:"jlist", quiet:true},
        {label:t("optBye"), act:"close", quiet:true},
      ]);
}

// 树洞回顾

function openJournalList(){

    <div class="chat-top">

/* ---------- 小暖的对话 ---------- */
// 没有后端，所以这是剧本式对话：小暖读得到今天的心情、番茄钟数、
// 没做完的目标，回应是真的对得上号，但不是自由输入的 AI。

function undoneGoals(){
  const out = [];
  CATEGORIES.forEach(c=>{
    if(c.kind === "fun") return;
    (state.goals[c.id]||[]).forEach(g=>{
      if(!g.done && (g.text||"").trim()) out.push({cat:c, g});
    });
  });
  return out;
}

function greetWord(){
  const h = new Date().getHours();
  if(h < 6)  return t("greetNight");
  if(h < 11) return t("greetMorning");
  if(h < 14) return t("greetNoon");
  if(h < 18) return t("greetAfternoon");
  return t("greetEvening");
}

// 心情卡片里的那一行
function buddyLineFor(m){
  const done = todayPomos();
  if(!m.low){
    return done > 0 ? t("sayGoodDone", done) : t("sayGood");
  }
  return t("sayLow");
}

let chatBusy = false;

function openChat(){
  const modal = document.getElementById("chatModal");
  const card  = document.getElementById("chatCard");
  card.innerHTML = `
    <div class="chat-top">
      <div class="buddy-avatar">${buddySvg()}</div>
      <span class="ct-name">${buddyName()}<small>${buddyRole()}</small></span>
      <button class="nav-close" aria-label="close">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-opts" id="chatOpts"></div>
    <div class="chat-note">${t("buddyDisclaimer", buddyName())}</div>`;
  card.querySelector(".nav-close").addEventListener("click", closeChat);
  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));
  goChat("open");
}

function closeChat(){
  const modal = document.getElementById("chatModal");
  const card  = document.getElementById("chatCard");
  card.classList.remove("show");
  setTimeout(()=>{ modal.classList.remove("open"); card.innerHTML=""; }, 220);
}

function chatBubble(text, cls){
  const body = document.getElementById("chatBody");
  if(!body) return;
  const d = document.createElement("div");
  d.className = "bub " + (cls || "her");
  if(cls === "care") d.innerHTML = text; else d.textContent = text;
  body.appendChild(d);
  body.scrollTop = body.scrollHeight;
}

function chatTyping(on){
  const body = document.getElementById("chatBody");
  if(!body) return;
  const old = body.querySelector(".chat-typing");
  if(old) old.remove();
  if(on){
    const d = document.createElement("div");
    d.className = "chat-typing";
    d.innerHTML = "<i></i><i></i><i></i>";
    body.appendChild(d);
    body.scrollTop = body.scrollHeight;
  }
}

function chatOptions(opts){
  const box = document.getElementById("chatOpts");
  if(!box) return;
  box.innerHTML = "";
  (opts||[]).forEach(o=>{
    const b = document.createElement("button");
    b.className = "chat-opt" + (o.quiet ? " quiet" : "");
    b.textContent = o.label;
    b.addEventListener("click", ()=>{
      if(chatBusy) return;
      chatBubble(o.label, "me");
      if(o.act === "close"){ setTimeout(closeChat, 260); return; }
      if(o.act === "start"){
        const u = undoneGoals()[0];
        closeChat();
        if(u) setTimeout(()=>openStartSheet(u.cat.id, u.g.id, STARTER_MIN), 280);
        return;
      }
      goChat(o.next);
    });
    box.appendChild(b);
  });
}

// 逐句"打字"，让它有陪伴感而不是弹一堵字
async function playLines(lines, opts){
  chatBusy = true;
  chatOptions([]);
  for(const line of lines){
    chatTyping(true);
    await new Promise(r=>setTimeout(r, Math.min(950, 340 + line.text.length * 22)));
    chatTyping(false);
    chatBubble(line.text, line.cls);
  }
  chatBusy = false;
  chatOptions(opts);
  bindCareCard();
}

async function goChat(nodeId){
  if(nodeId === "journal"){ openJournal(); return; }
  if(nodeId === "jlist"){ openJournalList(); return; }
  const node = chatNode(nodeId);
  if(!node) return;
  await playLines(node.lines, node.opts);
}

/* ---------- 求助名单：由用户自己填，所以放之四海皆准 ---------- */
// 与其硬编码某个国家的热线号码（会过时、会错、也只对一国有效），
// 不如让用户在状态好的时候先写下自己信得过的人 —— 真难受的时候更打得出去。
const SUPPORT_RELS = [
  {id:"family",  icon:"🏠", name:{zh:"家人",   en:"Family"}},
  {id:"teacher", icon:"🎓", name:{zh:"老师",   en:"Teacher"}},
  {id:"friend",  icon:"🤝", name:{zh:"朋友",   en:"Friend"}},
  {id:"line",    icon:"☎️", name:{zh:"热线",   en:"Helpline"}},
  {id:"other",   icon:"💬", name:{zh:"其他",   en:"Other"}},
];
const relById = id => SUPPORT_RELS.find(r=>r.id===id) || SUPPORT_RELS[4];

// tel: 链接只保留数字、+ 和几个拨号字符
function telHref(tel){
  const clean = (tel||"").replace(/[^\d+#*,;]/g, "");
  return clean ? `tel:${clean}` : null;
}

function careCard(){
  const list = state.support || [];
  let rows;
  if(list.length === 0){
    rows = `<div class="care-empty">${t("careNoList")}</div>
            <button class="care-set" data-care-setup>${t("careSetup")}</button>`;
  } else {
    rows = `<div class="care-list">` + list.map(p=>{
      const rel = relById(p.rel);
      const href = telHref(p.tel);
      const inner = `<span class="cl-ic">${rel.icon}</span>
        <span class="cl-txt"><b>${escapeHtml(p.name)}</b><small>${L(rel.name)}${p.tel?" · "+escapeHtml(p.tel):""}</small></span>
        ${href?`<span class="cl-call">${t("careCall")}</span>`:""}`;
      return href
        ? `<a class="cl-row" href="${href}">${inner}</a>`
        : `<div class="cl-row">${inner}</div>`;
    }).join("") + `</div>
    <button class="care-set ghost" data-care-setup>${t("careEditList")}</button>`;
  }
  return `<b>${t("careTitle")}</b>${rows}<div class="care-generic">${t("careGeneric")}</div>`;
}

// care 卡片是插在聊天气泡里的，绑定要在它渲染之后做
function bindCareCard(){
  document.querySelectorAll("[data-care-setup]").forEach(b=>{
    if(b.dataset.bound) return;
    b.dataset.bound = "1";
    b.addEventListener("click", ()=>{ closeChat(); setTimeout(openSupportSheet, 240); });
  });
}

/* ---------- 编辑求助名单 ---------- */
function openSupportSheet(){
  const modal = document.getElementById("chatModal");
  const card  = document.getElementById("chatCard");
  let rel = "family";

  const paint = ()=>{
    const list = state.support || [];
    const rows = list.length === 0
      ? `<div class="j-empty">${t("supEmpty")}</div>`
      : list.map(p=>{
          const r = relById(p.rel);
          return `<div class="sup-row">
            <span class="cl-ic">${r.icon}</span>
            <span class="cl-txt"><b>${escapeHtml(p.name)}</b><small>${L(r.name)}${p.tel?" · "+escapeHtml(p.tel):""}</small></span>
            <button class="j-del" data-sup-del="${p.id}" aria-label="delete">✕</button>
          </div>`;
        }).join("");
    const chips = SUPPORT_RELS.map(r=>
      `<button class="rel-chip${rel===r.id?" on":""}" data-rel="${r.id}">${r.icon} ${L(r.name)}</button>`).join("");

    card.innerHTML = `
      <div class="chat-top">
        <div class="buddy-avatar">${buddySvg()}</div>
        <span class="ct-name">${t("supTitle")}<small>${t("supSub")}</small></span>
        <button class="nav-close" aria-label="close">✕</button>
      </div>
      <div class="sup-wrap">
        <div class="j-prompt">${t("supWhy")}</div>
        <div class="sup-list">${rows}</div>
        <div class="sup-add">
          <div class="rel-chips">${chips}</div>
          <input class="sup-in" data-sup-name maxlength="20" placeholder="${t("supName")}">
          <input class="sup-in" data-sup-tel  maxlength="30" inputmode="tel" placeholder="${t("supTel")}">
          <button class="start-go" data-sup-add>${t("supAdd")}</button>
        </div>
        <div class="j-hint">${t("supHint")}</div>
      </div>`;
    card.querySelector(".nav-close").addEventListener("click", closeChat);
    card.querySelectorAll("[data-rel]").forEach(b=>{
      b.addEventListener("click", ()=>{ rel = b.dataset.rel; paint(); });
    });
    card.querySelectorAll("[data-sup-del]").forEach(b=>{
      b.addEventListener("click", ()=>{
        state.support = state.support.filter(x=>x.id !== b.dataset.supDel);
        save(state); paint();
      });
    });
    card.querySelector("[data-sup-add]").addEventListener("click", ()=>{
      const nameEl = card.querySelector("[data-sup-name]");
      const telEl  = card.querySelector("[data-sup-tel]");
      const name = nameEl.value.trim();
      if(!name) { nameEl.focus(); return; }
      state.support.push({id:uid("s"), name, rel, tel: telEl.value.trim()});
      save(state); paint();
    });
  };

  paint();
  if(!modal.classList.contains("open")){
    modal.classList.add("open");
    requestAnimationFrame(()=>card.classList.add("show"));
  }
}

function chatNode(id){
  const m = todayMood();
  const done = todayPomos();
  const undone = undoneGoals();
  const L_ = txt => ({text:txt});

  switch(id){

    case "open": {
      const lines = [L_(`${greetWord()}${t("openHi", buddyName())}`)];
      if(!m){
        lines.push(L_(t("openNoMood")));
        return {lines, opts:[
          {label:t("optGoMood"), act:"close"},
          {label:t("optJournal"), next:"journal"},
          {label:t("optSeeGoals"), next:"goals"},
        ]};
      }
      // 连续多天低落时，先主动把"找个人聊聊"放出来
      const lows = recentLowCount(7);
      if(m.low && lows >= 3 && state.careShown !== todayStr()){
        state.careShown = todayStr(); save(state);
        lines.push(L_(t("openManyLows", lows)));
        lines.push({text:careCard(), cls:"care"});
        return {lines, opts:[
          {label:t("optTalkAnyway"), next:"lowWhy"},
          {label:t("optNotNow"), next:"lowQuiet", quiet:true},
        ]};
      }
      if(m.low){
        lines.push(L_(t("openLow", L(m.name))));
        return {lines, opts:[
          {label:t("optJournal"), next:"journal"},
          {label:t("optTellWhy"), next:"lowWhy"},
          {label:t("optJustSit"), next:"lowQuiet"},
          {label:t("optSeeGoals"), next:"goals", quiet:true},
        ]};
      }
      lines.push(L_(done > 0 ? t("openGoodDone", done) : t("openGood")));
      return {lines, opts:[
        {label:t("optJournal"), next:"journal"},
        {label:t("optWhyGood"), next:"goodWhy"},
        {label:t("optSeeGoals"), next:"goals"},
        {label:t("optBye"), act:"close", quiet:true},
      ]};
    }

    /* ---- 心情不错 ---- */
    case "goodWhy":
      return {lines:[L_(t("goodWhyAsk"))], opts:[
        {label:t("optBecauseDone"), next:"goodDone"},
        {label:t("optBecausePeople"), next:"goodPeople"},
        {label:t("optNoReason"), next:"goodNoReason"},
      ]};
    case "goodDone":
      return {lines:[L_(t("goodDoneSay")), L_(t("goodDoneSay2"))], opts:[
        {label:t("optSeeGoals"), next:"goals"},
        {label:t("optBye"), act:"close", quiet:true},
      ]};
    case "goodPeople":
      return {lines:[L_(t("goodPeopleSay"))], opts:[
        {label:t("optSeeGoals"), next:"goals"},
        {label:t("optBye"), act:"close", quiet:true},
      ]};
    case "goodNoReason":
      return {lines:[L_(t("goodNoReasonSay"))], opts:[
        {label:t("optSeeGoals"), next:"goals"},
        {label:t("optBye"), act:"close", quiet:true},
      ]};

    /* ---- 心情低落：先接住，不急着给建议 ---- */
    case "lowWhy":
      return {lines:[L_(t("lowWhyAsk"))], opts:[
        {label:t("optJournal"), next:"journal"},
        {label:t("optAboutStudy"), next:"lowStudy"},
        {label:t("optAboutPeople"), next:"lowPeople"},
        {label:t("optCantSay"), next:"lowVague"},
        {label:t("optAlwaysLikeThis"), next:"care"},
      ]};
    case "lowStudy":
      return {lines:[L_(t("lowStudySay")), L_(t("lowStudySay2"))], opts:[
        {label:t("optTryFive"), act:"start"},
        {label:t("optRestFirst"), next:"lowRest"},
        {label:t("optAlwaysLikeThis"), next:"care", quiet:true},
      ]};
    case "lowPeople":
      return {lines:[L_(t("lowPeopleSay")), L_(t("lowPeopleSay2"))], opts:[
        {label:t("optRestFirst"), next:"lowRest"},
        {label:t("optAlwaysLikeThis"), next:"care"},
        {label:t("optBye"), act:"close", quiet:true},
      ]};
    case "lowVague":
      return {lines:[L_(t("lowVagueSay"))], opts:[
        {label:t("optJournal"), next:"journal"},
        {label:t("optRestFirst"), next:"lowRest"},
        {label:t("optTryFive"), act:"start"},
        {label:t("optAlwaysLikeThis"), next:"care", quiet:true},
      ]};
    case "lowQuiet":
      return {lines:[L_(t("lowQuietSay"))], opts:[
        {label:t("optJournal"), next:"journal"},
        {label:t("optBye"), act:"close"},
        {label:t("optChangedMind"), next:"lowWhy", quiet:true},
      ]};
    case "lowRest":
      return {lines:[L_(t("lowRestSay")), L_(t("lowRestSay2"))], opts:[
        ...(state.support.length === 0 && !state.supPromptOff
            ? [{label:t("optSetSupport"), next:"supIntro"}] : []),
        {label:t("optBye"), act:"close"},
        {label:t("optSeeGoals"), next:"goals", quiet:true},
      ]};

    /* ---- 顺口提一句：存两个人的号码 ---- */
    case "supIntro":
      markSupportPrompted();
      return {lines:[L_(t("supIntroSay")), L_(t("supIntroSay2"))], opts:[
        {label:t("supNudgeGo"), next:"supGo"},
        {label:t("optLater"), act:"close", quiet:true},
      ]};
    case "supGo":
      setTimeout(()=>{ closeChat(); setTimeout(openSupportSheet, 240); }, 200);
      return {lines:[L_(t("supGoSay"))], opts:[]};

    /* ---- 兜底：请去找真的人 ---- */
    case "care": {
      if(state.careShown !== todayStr()){ state.careShown = todayStr(); save(state); }
      return {lines:[
        L_(t("careSay")),
        {text:careCard(), cls:"care"},
        L_(t("careSay2")),
      ], opts:[
        {label:t("optOk"), act:"close"},
      ]};
    }

    /* ---- 目标 ---- */
    case "goals": {
      if(undone.length === 0){
        return {lines:[L_(done > 0 ? t("goalsAllDone") : t("goalsNone"))], opts:[
          {label:t("optBye"), act:"close"},
        ]};
      }
      const list = undone.slice(0,4).map(u=>`${u.cat.icon} ${u.g.text}`).join("\n");
      return {lines:[
        L_(t("goalsLeft", undone.length)),
        L_(list),
        L_(t("goalsNudge")),
      ], opts:[
        {label:t("optTryFive"), act:"start"},
        {label:t("optLater"), next:"goalsLater", quiet:true},
      ]};
    }
    case "goalsLater":
      return {lines:[L_(t("goalsLaterSay"))], opts:[
        {label:t("optOk"), act:"close"},
      ]};
  }
  return null;
}

/* ===================== PWA：装到主屏、离线可用 ===================== */

let deferredInstall = null;

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* 不支持就当普通网页用 */ });
  });
}

// 每次现取，而不是启动时缓存 —— 便于排查问题时直接改 UA 验证
function ua(){ return navigator.userAgent; }

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function isAndroid(){ return /Android/i.test(ua()); }
// iPadOS 的 Safari 会把自己报成 Macintosh，得靠触点数补判；安卓优先排除
function isIOS(){
  if(isAndroid()) return false;
  return /iPad|iPhone|iPod/.test(ua()) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

// 微信/QQ/小红书等 App 的内置浏览器：压根没有"添加到主屏幕"这个功能，
// 必须先「在浏览器中打开」。之前只判断了 iOS，才会给出错误的指引。
function inAppBrowser(){
  if(/MicroMessenger/i.test(ua()))                       return t("appWechat");
  if(/\bQQ\/|MQQBrowser|QQBrowser/i.test(ua()))          return t("appQQ");
  if(/Weibo/i.test(ua()))                                return t("appWeibo");
  if(/xhsdiscover|XiaoHongShu/i.test(ua()))              return t("appXhs");
  if(/AlipayClient/i.test(ua()))                         return t("appAlipay");
  if(/aweme|BytedanceWebview|ToutiaoMicroApp/i.test(ua())) return t("appDouyin");
  if(/DingTalk|Lark|Feishu/i.test(ua()))                 return t("appOther");
  return null;
}
// iOS 上只有 Safari 本体支持添加到主屏幕
function isIOSSafari(){
  return isIOS() && !inAppBrowser() &&
         !/CriOS|FxiOS|EdgiOS|OPiOS|UCBrowser|Quark|Baidu|SogouMobileBrowser/i.test(ua());
}

// 装完了就不再提示；其余情况都提示，只是给的指引不同
function canInstall(){
  return !isStandalone();
}
// 能不能一键装（安卓/桌面 Chrome 系）
function canOneTapInstall(){
  return !!deferredInstall;
}

// iOS 上苹果不开放"添加到主屏幕"的接口，任何网页都无法自己触发。
// 能做到的最短路径是用 Web Share API 一键唤起系统分享菜单，
// 让用户直接在菜单里点「添加到主屏幕」，省掉去底部找按钮那一步。
function canShareSheet(){
  return isIOS() && !inAppBrowser() && typeof navigator.share === "function";
}

// 唤起过一次之后，提示条里补一条兜底入口：有些 iOS 版本的分享菜单里
// 不一定有「添加到主屏幕」，别让用户走到这一步没退路
let sharedOnce = false;

async function openShareSheet(){
  try{
    await navigator.share({ title: t("appName"), url: pageLink() });
    sharedOnce = true;
    renderTasks();
  }catch(e){
    // AbortError = 用户自己取消了，不算失败，但同样给出兜底入口
    if(e && e.name === "AbortError"){ sharedOnce = true; renderTasks(); return; }
    showToast({emoji:"👇", msg:t("shareFail"), sub:t("shareFailSub")});
    showPointer();
  }
}

/* ---------- 指路：把分享按钮的位置直接标出来 ---------- */
function showPointer(){
  closeStartSheet();
  const el = document.getElementById("pointer");
  el.innerHTML = `
    <div class="pt-bubble">
      <p>${t("pointBubble")}</p>
      <button class="pt-got">${t("pointGot")}</button>
    </div>
    <div class="pt-arrow">⬇</div>
    <div class="pt-target">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 3l4 4h-3v9h-2V7H8l4-4z" fill="#fff"/>
        <path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7h-2v7H7v-7H5z" fill="#fff"/>
      </svg>
    </div>`;
  el.classList.add("open");
  el.querySelector(".pt-got").addEventListener("click", hidePointer);
  el.addEventListener("click", e=>{ if(e.target === el) hidePointer(); });
}
function hidePointer(){
  document.getElementById("pointer").classList.remove("open");
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredInstall = e;
  renderTasks();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstall = null;
  state.installDismissed = true;
  save(state);
  showToast({emoji:"🎉", msg:t("installedMsg"), sub:t("installedSub")});
  renderTasks();
});

async function doInstall(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null;
  renderTasks();
}

/* ===================== 首页提示条 ===================== */

// 今天第一个还没完成的非休闲目标，用于「先做 5 分钟」一键开始
function firstOpenGoal(){
  for(const c of CATEGORIES){
    if(c.kind === "fun") continue;
    const g = (state.goals[c.id]||[]).find(x=>!x.done && (x.text||"").trim());
    if(g) return {catId:c.id, gid:g.id};
  }
  return null;
}

function buildBanners(){
  const chips = [];

  // 每个胶囊只说一句话，一种字号一种颜色，emoji 之外不做任何强弱区分
  if(state.kickDismissed !== todayStr()){
    const open = firstOpenGoal();
    let line, ic, act;
    if(startedToday()){
      const mins = Math.round((state.history[todayStr()] || {s:0}).s / 60);
      line = t("kickDoneLine", mins); ic = "🎉"; act = open ? "go" : "none";
    } else if(!open){
      line = t("kickWriteLine");      ic = "📝"; act = "write";
    } else {
      line = t("kickGoLine");         ic = "🌤"; act = "go";
    }
    chips.push(`<div class="qk qk-start${startedToday()?" done":""}">
      <button class="q-main" data-kick="${act}"${act==="none"?" disabled":""}>
        <span class="q-ic">${ic}</span><span class="q-txt">${line}</span>
      </button>
      <button class="q-x" data-kick-x aria-label="close">✕</button>
    </div>`);
  }

  if(canInstall() && !state.installDismissed){
    const app = inAppBrowser();
    let act, verb;
    if(canOneTapInstall()){   act = "install"; verb = t("installGo"); }
    else if(canShareSheet()){ act = "share";   verb = t("installAddGo"); }
    else {                    act = "how";     verb = t("installHow"); }
    const line = app ? t("installLineApp", verb) : t("installLine", verb);
    chips.push(`<div class="qk qk-install">
      <button class="q-main" data-install="${act}">
        <span class="q-ic">📲</span><span class="q-txt">${line}</span>
      </button>
      <button class="q-x" data-install-x aria-label="close">✕</button>
    </div>`);
  }

  if(chips.length === 0) return "";
  return `<div class="quick-row">${chips.join("")}</div>`;
}

/* ---------- 安装指引：按实际所在的浏览器给出准确步骤 ---------- */
function openInstallSheet(){
  const modal = document.getElementById("startModal");
  const card  = document.getElementById("startCard");
  const app   = inAppBrowser();

  // 按当前环境组装步骤：内置浏览器要先跳出去，再按目标浏览器的做法装
  const blocks = [];
  if(app){
    blocks.push({title:t("installInAppTitle", app), steps:t("installInAppSteps", app), warn:true});
  }
  // 三条路径互斥，只给用户看跟他这台设备有关的那一段
  if(isAndroid()){
    blocks.push({title:t("installAndroidTitle"), steps:t("installAndroidSteps")});
  } else if(isIOS()){
    // 内置浏览器跳出去之后落到的是 Safari，所以这里总是给 Safari 的步骤
    blocks.push({title:t("installIosSafariTitle"), steps:t("installIosSafariSteps")});
    if(!app && !isIOSSafari()){
      blocks.push({title:t("installIosOtherTitle"), steps:t("installIosOtherSteps")});
    }
  } else {
    blocks.push({title:t("installDesktopTitle"), steps:t("installDesktopSteps")});
  }

  const html = blocks.map(b=>`
    <div class="how-block${b.warn?" warn":""}">
      <div class="how-title">${escapeHtml(b.title)}</div>
      <ol class="how-steps">${b.steps.map(s=>`<li>${escapeHtml(s)}</li>`).join("")}</ol>
    </div>`).join("");

  // 有捷径就把捷径放最上面，手动步骤退成"找不到时再看"
  const shortcut = canShareSheet() ? `
    <div class="how-tip">${t("shareNote")}</div>
    <button class="start-go" data-share>${t("shareGo")}</button>` : "";
  const manual = canShareSheet()
    ? `<details class="how-more"><summary>${t("installManual")}</summary>${html}</details>`
    : html;

  card.innerHTML = `
    <div class="nav-top">
      <span class="nav-title">${t("installTitle")}</span>
      <button class="nav-close" aria-label="close">✕</button>
    </div>
    <div class="start-sub">${t("installSub")}</div>
    ${shortcut}
    ${manual}
    ${isIOS() && !app ? `<button class="how-secondary" data-point>${t("pointMe")}</button>` : ""}
    <div class="how-link">
      <span class="hl-label">${t("linkLabel")}</span>
      <span class="hl-url" data-url>${escapeHtml(pageLink())}</span>
    </div>
    <button class="${canShareSheet() ? "how-secondary" : "start-go"}" data-copy>${t("copyLink")}</button>`;
  card.querySelector(".nav-close").addEventListener("click", closeStartSheet);
  card.querySelector("[data-copy]").addEventListener("click", copyPageLink);
  const shareBtn = card.querySelector("[data-share]");
  if(shareBtn) shareBtn.addEventListener("click", openShareSheet);
  const pointBtn = card.querySelector("[data-point]");
  if(pointBtn) pointBtn.addEventListener("click", showPointer);

  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));
}

function pageLink(){ return location.href.split("#")[0]; }

async function copyPageLink(){
  const url = pageLink();
  let ok = false;
  try{
    await navigator.clipboard.writeText(url);
    ok = true;
  }catch(e){
    // 内置浏览器常禁用 clipboard API，退回老办法
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.cssText = "position:fixed;top:-999px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try{ ok = document.execCommand("copy"); }catch(err){ ok = false; }
    ta.remove();
  }
  // 复制不成功就别谎报成功，指给用户页面上那行可以手动选中的网址
  if(ok){
    showToast({emoji:"✂️", msg:t("copied"), sub:t("copiedSub")});
  }else{
    showToast({emoji:"👇", msg:t("copyFail"), sub:t("copyFailSub")});
    const el = document.querySelector("[data-url]");
    if(el){
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }
  }
}

function bindBanners(el){
  const kickBtn = el.querySelector("[data-kick]");
  if(kickBtn) kickBtn.addEventListener("click", ()=>{
    const act = kickBtn.dataset.kick;
    if(act === "write"){
      // 一个目标都还没写：把光标送到第一个输入框
      const first = el.querySelector(".goal-input");
      if(first){ first.focus(); first.scrollIntoView({block:"center", behavior:"smooth"}); }
      return;
    }
    const g = firstOpenGoal();
    if(g) openStartSheet(g.catId, g.gid, startedToday() ? state.focusMin : STARTER_MIN);
  });
  const kickX = el.querySelector("[data-kick-x]");
  if(kickX) kickX.addEventListener("click", ()=>{
    state.kickDismissed = todayStr(); save(state); renderTasks();
  });
  const inst = el.querySelector("[data-install]");
  if(inst) inst.addEventListener("click", ()=>{
    const act = inst.dataset.install;
    if(act === "install")    doInstall();
    else if(act === "share") openShareSheet();   // 直接弹系统菜单，不再进弹层
    else                     openInstallSheet();
  });
  const instHow = el.querySelector("[data-install-how]");
  if(instHow) instHow.addEventListener("click", openInstallSheet);
  const instX = el.querySelector("[data-install-x]");
  if(instX) instX.addEventListener("click", ()=>{
    state.installDismissed = true; save(state); renderTasks();
  });
}

/* ===================== 每日提醒 ===================== */

// 没有后端就没法做真正的定时推送。这里只在 App 还开着（哪怕在后台）时提醒；
// 没开着的话，用户下次打开会看到首页的开场提示 —— 界面里如实说明了这一点。
function checkReminder(){
  if(!state.reminder) return;
  const today = todayStr();
  if(state.remindedDate === today) return;
  if(startedToday()) return;                 // 今天已经开始了，不打扰
  const [h, m] = state.reminder.split(":").map(Number);
  const now = new Date();
  if(now.getHours() < h || (now.getHours() === h && now.getMinutes() < m)) return;
  state.remindedDate = today;
  save(state);
  notify(t("remindNotifyTitle", buddyName()), t("remindNotifyBody"));
}

/* ===================== 启动：恢复中断的专注段 ===================== */

// 关掉标签页 / 手机锁屏后重新打开时，把当时那一段补结算掉。
// 因为每段都有固定时长上限，绝不会出现"忘记停止 = 记了一整夜"的情况。
function resumeSession(){
  const tm = state.timer;
  if(!tm) return;
  const past = (Date.now() - tm.start)/1000;

  if(past >= tm.durSec){
    // 离开期间这一段已经跑完了：直接落回首页，不要弹一个过期的结算屏
    closeFocusScreen();
    if(tm.phase === "focus" || tm.phase === "fun"){
      const r = settleFocus(true);
      render();
      if(r && r.earnedPomo){
        popTomato(r.catId);
        showToast({emoji:"🍅", msg:t("pomoDone"), sub:t("pomoDoneSub", r.mins)});
      }
    } else {
      state.timer = null;
      save(state);
      render();
    }
    return;
  }
  // 还没跑完 → 回到全屏，继续倒计时
  openFocusScreen();
  startTicking();
}

// 从后台切回前台时立刻校准一次，避免手机休眠导致 setInterval 被节流
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  checkReminder();
  if(!state.timer) return;
  if(phaseRemain() <= 0){
    stopTicking();
    if(state.timer.phase === "focus") finishFocus();
    else if(state.timer.phase === "fun") finishFun();
    else finishBreak();
  } else {
    paintFocusScreen(null);
  }
});

render();
resumeSession();
checkReminder();
setInterval(checkReminder, 60000);
</script>
