    const avail = availablePoints();
    const cost  = picked * POINTS_PER_FUN_MIN;
    const short = Math.max(0, cost - avail);
    const chips = FUN_OPTIONS.map(m=>{
      const c = m * POINTS_PER_FUN_MIN;
      return `<button class="dur-chip fun${picked===m?" on":""}" data-min="${m}"${c>avail?" disabled":""}>${
        m}<small>${t("funCost", c)}</small></button>`;
    }).join("");
    card.innerHTML = `
      <div class="nav-top">
        <span class="nav-title">${t("funTitle")}</span>
        <button class="nav-close" aria-label="close">✕</button>
      </div>
      <div class="start-goal">${cat.icon} ${escapeHtml(g.text || t("goalPlaceholder"))}</div>
      <div class="start-sub">${t("funSub")}</div>
      <div class="start-balance"><span>${t("funBalance")}</span><b>${avail}</b></div>
      <div class="dur-chips">${chips}</div>
      ${short > 0 ? `<div class="start-short">${t("funShort", short)}</div>` : ""}
      <div class="start-note">${t("funRule")}</div>
      <button class="start-go fun"${short>0?" disabled":""}>${t("funGo", cost)}</button>`;
    card.querySelector(".nav-close").addEventListener("click", closeStartSheet);
    card.querySelectorAll(".dur-chip").forEach(b=>{
      b.addEventListener("click", ()=>{ picked = parseInt(b.dataset.min,10); paint(); });
    });
    const go = card.querySelector(".start-go");
    if(!go.disabled) go.addEventListener("click", ()=>{
      closeStartSheet();
      startFun(catId, gid, picked);
    });
  };

  paint();
  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));
}

function startFun(catId, gid, minutes){
  const cost = minutes * POINTS_PER_FUN_MIN;
  if(cost > availablePoints()) return;
  state.spent += cost;
  state.redemptions.unshift({
    emoji: CATEGORIES.find(c=>c.id===catId).icon,
    name: t("funRedeemed", minutes),
    cost, date: todayStr()
  });
  state.timer = {catId, goalId:gid, start:Date.now(), durSec:minutes*60, phase:"fun"};
  save(state);
  chime(1);
  openFocusScreen();
  render();
  startTicking();
}

function finishFun(){
  const r = settleFocus(true);
  if(!r) return;
  chime(2);
  render();
  notify(t("funOver"), t("funOverSub"));
  paintFocusScreen({done:"fun"});
}

function closeStartSheet(){
  const modal = document.getElementById("startModal");
  const card  = document.getElementById("startCard");
  card.classList.remove("show");
  setTimeout(()=>{ modal.classList.remove("open"); card.innerHTML=""; }, 200);
}

function startFocus(catId, gid, minutes){
  // 记住常规时长（起步档是临时选择，不改变默认值）
  if(FOCUS_OPTIONS.includes(minutes)) state.focusMin = minutes;
  state.timer = {catId, goalId:gid, start:Date.now(), durSec:minutes*60, phase:"focus"};
  save(state);
  askNotifyPermission();
  chime(1);                       // 顺带在用户手势里激活音频，结束时才能出声
  openFocusScreen();
  renderTasks();
  startTicking();
}

function startBreak(){
  state.timer = {catId:null, goalId:null, start:Date.now(), durSec:BREAK_MIN*60, phase:"break"};
  save(state);
  openFocusScreen();
  startTicking();
}

/* ---------- 结算一个专注段 ---------- */
// finished=true 表示走完了全程；false 表示用户中途结束
function settleFocus(finished){
  if(!state.timer) return null;
  const isFun = state.timer.phase === "fun";
  if(state.timer.phase !== "focus" && !isFun) return null;

  const {catId, goalId, durSec} = state.timer;
  const elapsed = finished ? durSec : Math.min((Date.now()-state.timer.start)/1000, durSec);
  const mins = Math.round(elapsed/60);
  // 走完全程且不短于 25 分钟，才算一个真正的番茄钟（休闲时段永远不算）
  const earnedPomo = finished && !isFun && durSec >= POMO_MIN_LEN*60;

  const g = (state.goals[catId]||[]).find(x=>x.id===goalId);
  if(g){
    g.sec = (g.sec||0) + elapsed;
    if(earnedPomo) g.pomos = (g.pomos||0) + 1;
  }
  const cat = CATEGORIES.find(c=>c.id===catId);
  state.timer = null;

  // 休闲时段不计入专注统计，也不进周对比
  if(!isFun){
    state.pomoSecEver = (state.pomoSecEver||0) + elapsed;
    if(earnedPomo) state.pomoEver = (state.pomoEver||0) + 1;
    bumpHistory(earnedPomo?1:0, elapsed);
  }

  // 有效利用时间（学习/运动/社交）累积并换算经验值
  if(cat && cat.kind !== "fun"){
    state.effSecTotal = (state.effSecTotal||0) + elapsed;
  }
  if(earnedPomo){
    state.xp += XP_PER_POMO;
    state.totalXp += XP_PER_POMO;
    // 专注段给积分，积分能换休闲时长 —— 四个板块由此形成闭环
    state.catPoints[catId] = (state.catPoints[catId]||0) + POINTS_PER_POMO;
    while(state.xp >= xpNeeded(state.level)){
      state.xp -= xpNeeded(state.level);
      state.level += 1;
    }
  }
  save(state);
  if(cat && cat.kind !== "fun") awardTimeXp();
  checkBadges();
  return {mins, earnedPomo, catId, finished, durSec, isFun};
}

// 中途结束：记录已完成的时间，回到首页
function abandonFocus(){
  const r = settleFocus(false);
  closeFocusScreen();
  render();
  if(r && r.mins >= 1){
    showToast({emoji:"⏱", msg:t("partialDone", r.mins), sub:t("partialSub")});
  }
}
// 兼容旧调用点（删除目标时需要先停止计时）
function stopTimer(){ if(state.timer && state.timer.phase === "focus") abandonFocus(); else { state.timer=null; save(state); closeFocusScreen(); } }

// 专注时间到：结算并给出休息提示
function finishFocus(){
  const r = settleFocus(true);
  if(!r) return;
  chime(2);
  render();
  if(r.earnedPomo){
    popTomato(r.catId);
    notify(t("pomoDone"), t("pomoDoneSub", r.mins));
    paintFocusScreen({done:"focus", mins:r.mins, pomo:true});
    spawnConfetti();
  } else {
    notify(t("starterDone"), t("starterDoneSub"));
    paintFocusScreen({done:"focus", mins:r.mins, pomo:false});
  }
}

function finishBreak(){
  state.timer = null;
  save(state);
  chime(1);
  notify(t("breakOver"), t("breakOverSub"));
  paintFocusScreen({done:"break"});
  renderTasks();
}

/* ---------- 全屏专注界面 ---------- */
const RING_LEN = 2 * Math.PI * 104;   // 与 svg 里 r=104 对应

function openFocusScreen(){
  document.getElementById("focusScreen").classList.add("open");
  paintFocusScreen(null);
}
function closeFocusScreen(){
  document.getElementById("focusScreen").classList.remove("open");
}

// mode=null 正常进行中；{done:"focus"|"break"} 结算态
function paintFocusScreen(mode){
  const scr   = document.getElementById("focusScreen");
  if(!scr.classList.contains("open")) return;
  const elCat = document.getElementById("fsCat");
  const elGoal= document.getElementById("fsGoal");
  const elTime= document.getElementById("fsTime");
  const elPh  = document.getElementById("fsPhase");
  const elOf  = document.getElementById("fsOf");
  const elHint= document.getElementById("fsHint");
  const elBtns= document.getElementById("fsBtns");
  const elProg= document.getElementById("fsProg");
  elProg.setAttribute("stroke-dasharray", RING_LEN.toFixed(2));

  // ---- 结算态：专注段刚结束 ----
  // 长句一律放在环外的 fs-hint 里，环内只留大图标和一行极短的数字
  if(mode && mode.done === "focus"){
    scr.classList.remove("brk");
    elCat.textContent = "";
    elGoal.textContent = mode.pomo ? t("pomoDone") : t("starterDone");
    elTime.textContent = mode.pomo ? "🍅" : "👍";
    elPh.textContent   = t("fsOf", mode.mins);
    elOf.textContent   = mode.pomo ? t("pomoPoints", POINTS_PER_POMO) : "";
    elProg.setAttribute("stroke-dashoffset", "0");
    if(mode.pomo){
      elHint.innerHTML = `${escapeHtml(t("pomoDoneSub", mode.mins))}<br>${escapeHtml(t("fsHintBreak"))}`;
      elBtns.innerHTML = `<button class="fs-btn go" data-act="brk">${t("fsStartBreak")}</button>
                          <button class="fs-btn ghost" data-act="close">${t("fsSkipBreak")}</button>`;
    } else {
      // 5 分钟起步段太短，不需要休息，直接鼓励回去继续
      elHint.textContent = t("starterDoneSub");
      elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
    }
    bindFsBtns();
    return;
  }
  // ---- 结算态：休闲时间用完 ----
  if(mode && mode.done === "fun"){
    scr.classList.remove("brk"); scr.classList.add("fn");
    elCat.textContent  = "";
    elGoal.textContent = t("funOver");
    elTime.textContent = "⏰";
    elPh.textContent   = "";
    elOf.textContent   = "";
    elProg.setAttribute("stroke-dashoffset", "0");
    elHint.textContent = t("funOverSub");
    elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
    bindFsBtns();
    return;
  }
  // ---- 结算态：休息刚结束 ----
  if(mode && mode.done === "break"){
    scr.classList.add("brk");
    elCat.textContent = "";
    elGoal.textContent = t("breakOver");
    elTime.textContent = "☕";
    elPh.textContent   = "";
    elOf.textContent   = "";
    elProg.setAttribute("stroke-dashoffset", "0");
    elHint.textContent = t("breakOverSub");
    elBtns.innerHTML = `<button class="fs-btn primary" data-act="close">${t("fsClose")}</button>`;
    bindFsBtns();
    return;
  }

  // ---- 进行中 ----
  const tm = state.timer;
  if(!tm){ closeFocusScreen(); return; }
  const isBreak = tm.phase === "break";
  const isFun   = tm.phase === "fun";
  scr.classList.toggle("brk", isBreak);
  scr.classList.toggle("fn", isFun);

  const remain = phaseRemain();
  const mm = Math.floor(remain/60), ss = Math.floor(remain%60);
  elTime.textContent = `${mm}:${ss<10?"0":""}${ss}`;
  elProg.setAttribute("stroke-dashoffset", (RING_LEN * (1 - remain/tm.durSec)).toFixed(2));

  if(isFun){
    const cat = CATEGORIES.find(c=>c.id===tm.catId);
    const g = (state.goals[tm.catId]||[]).find(x=>x.id===tm.goalId);
    elCat.textContent  = cat ? `${cat.icon} ${L(cat.title)}` : "";
    elGoal.textContent = g ? (g.text || t("funPhase")) : t("funPhase");
    elPh.textContent   = t("funPhase");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = t("funHint");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="give">${t("fsGiveUp")}</button>`;
  } else if(isBreak){
    elCat.textContent  = "";
    elGoal.textContent = t("fsBreakTitle");
    elPh.textContent   = t("fsBreak");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = t("fsHintBreak");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="close">${t("fsSkipBreak")}</button>`;
  } else {
    const cat = CATEGORIES.find(c=>c.id===tm.catId);
    const g = (state.goals[tm.catId]||[]).find(x=>x.id===tm.goalId);
    elCat.textContent  = cat ? `${cat.icon} ${L(cat.title)}` : "";
    elGoal.textContent = g ? (g.text || t("goalPlaceholder")) : "";
    elPh.textContent   = t("fsFocus");
    elOf.textContent   = t("fsOf", Math.round(tm.durSec/60));
    elHint.textContent = tm.durSec <= STARTER_MIN*60 ? t("fsHintStarter") : t("fsHintFocus");
    elBtns.innerHTML = `<button class="fs-btn ghost" data-act="give">${t("fsGiveUp")}</button>`;
  }
  bindFsBtns();
}

function bindFsBtns(){
  document.querySelectorAll("#fsBtns .fs-btn").forEach(b=>{
    b.onclick = ()=>{
      const a = b.dataset.act;
      if(a === "give")       abandonFocus();
      else if(a === "brk")   startBreak();
      else if(a === "close"){ state.timer = null; save(state); closeFocusScreen(); render(); }
    };
  });
}

// 根据累计有效利用时间发放经验值（每小时 +10 XP），让角色等级与有效投入时间挂钩
function awardTimeXp(){
  const earnable = Math.floor(state.effSecTotal / SECONDS_PER_XP);
  const delta = earnable - state.timeXpAwarded;
  if(delta > 0){
    state.timeXpAwarded = earnable;
    state.xp += delta;
    state.totalXp += delta;
    let leveledUp = false;
    while(state.xp >= xpNeeded(state.level)){
      state.xp -= xpNeeded(state.level);
      state.level += 1;
      leveledUp = true;
    }
    save(state);
    showToast({emoji:"⏱", msg:t("timeXpToast", delta), sub:t("timeXpSub")});
    if(leveledUp){
      const stage = getStage(state.level);
      setTimeout(()=>showToast({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true}), 1600);
    }
    checkBadges();
  }
}

/* ===================== 积分 & 兑换（弹层内容） ===================== */

function buildRewards(el){
  const total = totalPoints();

  // 计分类别的积分明细（娱乐不计分，不显示）
  let breakdown = "";
  CATEGORIES.filter(c=>c.kind!=="fun").forEach(c=>{
    breakdown += `<span class="pt-cat">${c.icon}${state.catPoints[c.id]||0}</span>`;
  });

  // 兑换记录
  let rows = "";
  if(state.redemptions.length === 0){
    rows = `<div class="redeem-empty">${t("redeemEmpty")}</div>`;
  } else {
    state.redemptions.forEach(r=>{
      rows += `
        <div class="redeem-row">
          <span class="r-ic">${r.emoji}</span>
          <span class="r-name">${r.name}</span>
          <span class="r-meta">${r.date}<br><span class="r-cost">${t("costUnit", r.cost)}</span></span>
        </div>`;
    });
  }

  // 心愿奖励清单：积分的另一个出口（现实里的奖励，找家长兑现）
  const avail = availablePoints();
  let wishes = "";
  state.wishList.forEach(w=>{
    const afford = avail >= w.cost;
    wishes += `
      <div class="wish-item">
        <span class="w-ic">${w.emoji}</span>
        <span class="w-info">
          <span class="w-name">${escapeHtml(typeof w.name === "object" ? L(w.name) : w.name)}</span>
          <span class="w-cost">${t("funCost", w.cost)}</span>
        </span>
        <button class="redeem-btn" data-wish="${w.id}"${afford?"":" disabled"}>${t("wishRedeem")}</button>
        <button class="w-del" data-wish-del="${w.id}" aria-label="delete">✕</button>
      </div>`;
  });

  el.innerHTML = navHeader("rewardsTitle") + `
    <div class="points-head">
      <span class="pt-total">${t("pointsTotalLabel", total)}</span>
      <span class="pt-avail">${t("availLabel", avail)}</span>
    </div>
    <div class="pt-breakdown">${breakdown}</div>
    <div class="rules-box">${escapeHtml(t("redeemRules")).replace(/\n/g,"<br>")}</div>
    <div class="sub-head">${t("wishListHead")}</div>
    ${wishes}
    <div class="wish-add">
      <input class="n" data-wish-name placeholder="${t("wishAddName")}" maxlength="16">
      <input class="c" data-wish-cost type="number" min="1" step="1" placeholder="${t("wishAddCost")}">
      <button data-wish-add>${t("wishAdd")}</button>
    </div>
    <div class="sub-head">${t("redeemTitle")}</div>
    ${rows}
  `;

  el.querySelectorAll("[data-wish]").forEach(b=>{
    b.addEventListener("click", ()=>redeemWish(b.dataset.wish));
  });
  el.querySelectorAll("[data-wish-del]").forEach(b=>{
    b.addEventListener("click", ()=>{
      state.wishList = state.wishList.filter(w=>w.id !== b.dataset.wishDel);
      save(state); refreshNav();
    });
  });
  el.querySelector("[data-wish-add]").addEventListener("click", ()=>{
    const nameEl = el.querySelector("[data-wish-name]");
    const costEl = el.querySelector("[data-wish-cost]");
    const name = nameEl.value.trim();
    const cost = parseInt(costEl.value, 10);
    if(!name || !(cost > 0)) return;
    state.wishList.push({id:"w"+Date.now().toString(36), emoji:"🎁", name, cost});
    save(state); refreshNav();
  });
}

function redeemWish(id){
  const w = state.wishList.find(x=>x.id === id);
  if(!w || availablePoints() < w.cost) return;
  state.spent += w.cost;
  state.redemptions.unshift({
    emoji: w.emoji,
    name: typeof w.name === "object" ? L(w.name) : w.name,
    cost: w.cost,
    date: todayStr()
  });
  save(state);
  refreshNav();
  spawnConfetti();
  showToast({emoji:"🎁", msg:t("redeemDone", typeof w.name === "object" ? L(w.name) : w.name), sub:t("redeemDoneSub")});
}

function checkBadges(){
  BADGES.forEach(b=>{
    if(!state.unlockedBadges.includes(b.id) && b.need(state)){
      state.unlockedBadges.push(b.id);
      setTimeout(()=>showToast({emoji:b.icon, msg:t("newBadge"), sub:L(b.name), levelup:true}), 700);
    }
  });
}

function completeGoal(catId, goal){
  const cat = CATEGORIES.find(c=>c.id===catId);

  // 娱乐类目标：仅打卡记录，不计积分、不发经验、不触发奖励小游戏
  if(cat.kind === "fun"){
    save(state);
    renderTasks();
    return;
  }

  // 学习/运动/社交目标：该类别 +10 分（总积分 = 三类之和），同时 +10 经验值
  state.catPoints[catId] = (state.catPoints[catId]||0) + POINTS_PER_GOAL;
  state.xp += POINTS_PER_GOAL;
  state.totalXp += POINTS_PER_GOAL;

  let leveledUp = false;
  while(state.xp >= xpNeeded(state.level)){
    state.xp -= xpNeeded(state.level);
    state.level += 1;
    leveledUp = true;
  }

  const today = todayStr();
  if(state.lastCompleteDate !== today){
    const yesterday = yesterdayStr();
    state.streak = (state.lastCompleteDate === yesterday) ? state.streak + 1 : 1;
    state.lastCompleteDate = today;
  }

  // 全勤：每个类别都有目标且全部完成
  const allDone = CATEGORIES.every(c => {
    const gs = state.goals[c.id] || [];
    return gs.length > 0 && gs.every(g=>g.done);
  });
  if(allDone) state.allDoneEver = true;

  save(state);
  render();
  pulseAvatar();
  spawnConfetti();

  const pick = ENCOURAGEMENTS[Math.floor(Math.random()*ENCOURAGEMENTS.length)];
  showToast({emoji:pick.emoji, msg:L(pick.msg), sub:L(pick.sub)});

  const pendingToasts = [];
  if(leveledUp){
    const stage = getStage(state.level);
    pendingToasts.push({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true});
  }
  checkBadgesQuiet(pendingToasts);
  if(allDone){
    pendingToasts.push({emoji:"🏆", msg:t("perfectDay"), sub:t("perfectDaySub"), levelup:true});
  }

  setTimeout(()=>{
    launchMiniGame(cat, (bonusXp)=>{
      if(bonusXp > 0){
        applyBonusXp(bonusXp);
      }
      showToastSequence(pendingToasts);
    });
  }, 1300);
}

function applyBonusXp(amount){
  state.xp += amount;
  state.totalXp += amount;
  let leveledUp = false;
  while(state.xp >= xpNeeded(state.level)){
    state.xp -= xpNeeded(state.level);
    state.level += 1;
    leveledUp = true;
  }
  save(state);
  render();
  if(leveledUp){
    const stage = getStage(state.level);
    showToast({emoji:stage.emoji, msg:t("levelUp", state.level), sub:t("evolvedInto", L(stage.name)), levelup:true});
  }
  checkBadges();
}

function checkBadgesQuiet(pendingToasts){
  let changed = false;
  BADGES.forEach(b=>{
    if(!state.unlockedBadges.includes(b.id) && b.need(state)){
      state.unlockedBadges.push(b.id);
      pendingToasts.push({emoji:b.icon, msg:t("newBadge"), sub:L(b.name), levelup:true});
      changed = true;
    }
  });
  if(changed){ save(state); render(); }
}

function showToastSequence(list){
  if(!list.length) return;
  let delay = 0;
  list.forEach(t=>{
    setTimeout(()=>showToast(t), delay);
    delay += 1600;
  });
}

function pulseAvatar(){
  const av = document.getElementById("avatar");
  av.classList.remove("pulse");
  void av.offsetWidth;
  av.classList.add("pulse");
}

function showToast(opt){
  const wrap = document.getElementById("toast");
  const card = document.createElement("div");
  card.className = "toast-card" + (opt.levelup ? " levelup-card" : "");
  card.innerHTML = `
    <div class="toast-emoji">${opt.emoji}</div>
    <div class="toast-msg">${opt.msg}</div>
    <div class="toast-sub">${opt.sub}</div>
  `;
  wrap.innerHTML = "";
  wrap.appendChild(card);
  requestAnimationFrame(()=>card.classList.add("show"));
  setTimeout(()=>{
    card.classList.remove("show");
    setTimeout(()=>{ if(wrap.contains(card)) wrap.removeChild(card); }, 300);
  }, 1500);
}

function spawnConfetti(){
  const colors = ["#ff8c42","#7bd389","#a78bfa","#ffd166","#4cc9f0"];
  const av = document.getElementById("avatar");
  const rect = av.getBoundingClientRect();
  for(let i=0;i<14;i++){
    const dot = document.createElement("div");
    dot.className = "confetti";
    dot.style.left = (rect.left + rect.width/2 + (Math.random()*60-30)) + "px";
    dot.style.top = (rect.top + rect.height/2) + "px";
    dot.style.background = colors[Math.floor(Math.random()*colors.length)];
    dot.style.position = "fixed";
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(), 1200);
  }
}

document.querySelectorAll(".lang-toggle button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    localStorage.setItem(LANG_KEY, lang);
    render();
  });
});

/* ===================== 小游戏奖励关卡 ===================== */

// 每个类别对应一个专属小游戏
const GAME_FN = {
  math: renderMathQuiz,        // 学习 → 速算闯关（需要专注思考）
  piano: renderPianoTiles,     // 运动 → 节奏方块（快速敲击、活力满满）
  memory: renderMemorySequence,// 娱乐 → 记忆序列
  reflex: renderReflexTest,    // 社交 → 极速反应（快速回应、临场反应）
};

function launchMiniGame(category, onClose){
  const modal = document.getElementById("gameModal");
  const card = document.getElementById("gameCard");
  const pick = GAME_FN[category.game] || renderMathQuiz;

  modal.classList.add("open");
  requestAnimationFrame(()=>card.classList.add("show"));

  function close(bonusXp){
    card.classList.remove("show");
    setTimeout(()=>{
      modal.classList.remove("open");
      card.innerHTML = "";
      onClose(bonusXp);
    }, 250);
  }

  pick(card, category, close);
}

function starsToXp(stars){ return stars * 10; }

function showGameResult(card, stars, title){
  const bonus = starsToXp(stars);
  const starStr = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  card.innerHTML = `
    <div class="game-result">
      <div class="game-title">${title}</div>
      <div class="stars">${starStr}</div>
      <div class="bonus">${bonus > 0 ? t("bonusXp", bonus) : t("tryAgain")}</div>
      <button class="start-game-btn" id="resultCloseBtn">${t("great")}</button>
    </div>
  `;
  document.getElementById("resultCloseBtn").addEventListener("click", ()=>{
    card._onFinish(bonus);
  });
}

function renderPianoTiles(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="pianoExitBtn">✕</button>
    <div class="game-title">${t("pianoTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("pianoSub")}</div>
    <div class="game-hud"><span id="pianoScore">🎯 0</span><span id="pianoTimer">⏱ 15s</span></div>
    <div class="game-area"><div class="lane-area" id="pianoLanes"></div></div>
  `;
  const lanesWrap = document.getElementById("pianoLanes");
  const scoreEl = document.getElementById("pianoScore");
  const timerEl = document.getElementById("pianoTimer");
  const LANE_COUNT = 4;
  const lanes = [];
  for(let i=0;i<LANE_COUNT;i++){
    const lane = document.createElement("div");
    lane.className = "lane";
    lanesWrap.appendChild(lane);
    lanes.push(lane);
  }
  const hitZone = document.createElement("div");
  hitZone.className = "hit-zone";
  lanesWrap.appendChild(hitZone);

  let score = 0;
  let spawned = 0;
  let timeLeft = 15;
  let running = true;
  let speed = 1.5;

  document.getElementById("pianoExitBtn").addEventListener("click", ()=>{
    running = false;
    clearInterval(spawnHandle);
    clearInterval(timerHandle);
    close(0);
  });

  function spawnTile(){
    if(!running) return;
    spawned += 1;
    const laneIdx = Math.floor(Math.random()*LANE_COUNT);
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.style.animationDuration = speed + "s";
    lanes[laneIdx].appendChild(tile);

    tile.addEventListener("click", ()=>{
      if(tile.dataset.gone) return;
      tile.dataset.gone = "1";
      score += 1;
      scoreEl.textContent = "🎯 " + score;
      tile.classList.add("tapped");
      tile.style.transition = "opacity .15s";
      tile.style.opacity = "0";
      setTimeout(()=>tile.remove(), 150);
    });
    tile.addEventListener("animationend", ()=>{ if(tile.parentNode) tile.remove(); });
  }

  const spawnHandle = setInterval(spawnTile, 480);
  const speedHandle = setInterval(()=>{ speed = Math.max(0.8, speed - 0.1); }, 3000);
  const timerHandle = setInterval(()=>{
    timeLeft -= 1;
    timerEl.textContent = "⏱ " + timeLeft + "s";
    if(timeLeft <= 0){
      running = false;
      clearInterval(spawnHandle);
      clearInterval(speedHandle);
      clearInterval(timerHandle);
      const accuracy = spawned > 0 ? score/spawned : 0;
      let stars = 0;
      if(score >= 16 && accuracy >= 0.6) stars = 3;
      else if(score >= 10) stars = 2;
      else if(score >= 4) stars = 1;
      setTimeout(()=>showGameResult(card, stars, t("pianoEnd")), 400);
    }
  }, 1000);
}

function renderReflexTest(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="reflexExitBtn">✕</button>
    <div class="game-title">${t("reflexTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("reflexSub")}</div>
    <div class="game-area" id="reflexArea">
      <div class="reflex-box" id="reflexBox">
        <div class="reflex-main" id="reflexMain">${t("reflexStart")}</div>
        <div class="reflex-sub" id="reflexSub">${t("reflexRoundsInfo")}</div>
      </div>
    </div>
    <div class="reflex-rounds" id="reflexRounds">
      <div class="reflex-dot"></div><div class="reflex-dot"></div><div class="reflex-dot"></div>
    </div>
  `;
  const box = document.getElementById("reflexBox");
  const main = document.getElementById("reflexMain");
  const sub = document.getElementById("reflexSub");
  const dots = document.querySelectorAll("#reflexRounds .reflex-dot");

  let round = 0;
  let waitTimeout = null;
  let goTime = 0;
  let phase = "idle"; // idle -> waiting -> go
  const times = [];

  document.getElementById("reflexExitBtn").addEventListener("click", ()=>{
    if(waitTimeout) clearTimeout(waitTimeout);
    close(0);
  });

  function startRound(){
    phase = "waiting";
    box.className = "reflex-box";
    main.textContent = t("reflexWaiting");
    sub.textContent = t("reflexRound", round+1);
    const delay = 800 + Math.random()*1800;
    waitTimeout = setTimeout(()=>{
      phase = "go";
      goTime = Date.now();
      box.classList.add("go");
      main.textContent = t("reflexGo");
      sub.textContent = "";
    }, delay);
  }

  box.addEventListener("click", ()=>{
    if(phase === "idle"){
      startRound();
      return;
    }
    if(phase === "waiting"){
      clearTimeout(waitTimeout);
      box.classList.add("early");
      main.textContent = t("reflexEarly");
      sub.textContent = t("reflexEarlySub");
      times.push(1000);
      advanceRound();
      return;
    }
    if(phase === "go"){
      const rt = Date.now() - goTime;
      times.push(rt);
      main.textContent = rt + " ms";
      sub.textContent = t("reflexNice");
      advanceRound();
    }
  });

  function advanceRound(){
    dots[round].classList.add("done");
    round += 1;
    phase = "idle";
    if(round >= 3){
      const avg = times.reduce((a,b)=>a+b,0) / times.length;
      let stars = 0;
      if(avg <= 350) stars = 3; else if(avg <= 550) stars = 2; else if(avg <= 800) stars = 1;
      setTimeout(()=>showGameResult(card, stars, t("reflexAvg", Math.round(avg))), 900);
    } else {
      setTimeout(startRound, 900);
    }
  }
}

const QUIZ_BANK = [
  {q:"7 × 8 = ?", a:["54","56","58","64"], correct:1},
  {q:"15 + 27 = ?", a:["42","41","52","32"], correct:0},
  {q:"9² = ?", a:["72","81","91","18"], correct:1},
  {q:"100 ÷ 4 = ?", a:["20","25","24","16"], correct:1},
  {q:"6 × 9 = ?", a:["56","54","63","45"], correct:1},
  {q:"144 ÷ 12 = ?", a:["10","12","14","11"], correct:1},
  {q:"13 × 3 = ?", a:["36","39","42","33"], correct:1},
  {q:"81 - 29 = ?", a:["52","51","62","42"], correct:0},
];

function renderMathQuiz(card, quest, close){
  card._onFinish = close;
  const questions = shuffle(QUIZ_BANK).slice(0,5);
  let idx = 0;
  let score = 0;
  let locked = false;

  card.innerHTML = `
    <button class="game-exit-btn" id="quizExitBtn">✕</button>
    <div class="game-title">${t("quizTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("quizSub")}</div>
    <div class="game-area"><div class="quiz-area" id="quizArea"></div></div>
    <div class="quiz-progress" id="quizProgress"></div>
  `;
  const area = document.getElementById("quizArea");
  const progress = document.getElementById("quizProgress");
  for(let i=0;i<questions.length;i++){
    const d = document.createElement("div");
    d.className = "quiz-dot";
    progress.appendChild(d);
  }

  document.getElementById("quizExitBtn").addEventListener("click", ()=>close(0));

  function renderQuestion(){
    const item = questions[idx];
    const answerOrder = item.a.map((text,i)=>({text, isCorrect:i===item.correct}));
    area.innerHTML = `
      <div class="quiz-question">${item.q}</div>
      <div class="quiz-answers">
        ${answerOrder.map((opt,i)=>`<button class="quiz-answer-btn" data-i="${i}">${opt.text}</button>`).join("")}
      </div>
    `;
    locked = false;
    area.querySelectorAll(".quiz-answer-btn").forEach((btn,i)=>{
      btn.addEventListener("click", ()=>{
        if(locked) return;
        locked = true;
        const isCorrect = answerOrder[i].isCorrect;
        btn.classList.add(isCorrect ? "correct" : "wrong");
        if(isCorrect) score += 1;
        else {
          area.querySelectorAll(".quiz-answer-btn").forEach((b2,j)=>{
            if(answerOrder[j].isCorrect) b2.classList.add("correct");
          });
        }
        progress.children[idx].classList.add("answered");
        setTimeout(nextQuestion, 700);
      });
    });
  }

  function nextQuestion(){
    idx += 1;
    if(idx >= questions.length){
      let stars = 0;
      if(score >= 5) stars = 3; else if(score >= 3) stars = 2; else if(score >= 1) stars = 1;
      setTimeout(()=>showGameResult(card, stars, t("quizResult", score, questions.length)), 200);
    } else {
      renderQuestion();
    }
  }

  renderQuestion();
}

function renderMemorySequence(card, quest, close){
  card._onFinish = close;
  card.innerHTML = `
    <button class="game-exit-btn" id="seqExitBtn">✕</button>
    <div class="game-title">${t("seqTitle")}</div>
    <div class="game-sub">${t("unlockHint", L(quest.title))}${t("seqSub")}</div>
    <div class="game-area">
      <div class="seq-grid" id="seqGrid">
        <div class="seq-pad p0" data-pad="0"></div>
        <div class="seq-pad p1" data-pad="1"></div>
        <div class="seq-pad p2" data-pad="2"></div>
        <div class="seq-pad p3" data-pad="3"></div>
      </div>
    </div>
    <div class="seq-status" id="seqStatus">${t("seqRound", 1)}</div>
  `;
  const pads = card.querySelectorAll(".seq-pad");
  const statusEl = document.getElementById("seqStatus");

  let sequence = [];
  let round = 0;
  let inputIdx = 0;
  let accepting = false;
  let timeouts = [];
  let finished = false;

  function clearTimers(){ timeouts.forEach(clearTimeout); timeouts = []; }

  document.getElementById("seqExitBtn").addEventListener("click", ()=>{
    finished = true;
    clearTimers();
    close(0);
  });

  function flash(idx, on){
    pads[idx].classList.toggle("lit", on);
  }

  function playSequence(){
    accepting = false;
    statusEl.textContent = t("seqWatch");
    let delay = 500;
    sequence.forEach(padIdx=>{
      timeouts.push(setTimeout(()=>flash(padIdx, true), delay));
      timeouts.push(setTimeout(()=>flash(padIdx, false), delay+420));
      delay += 620;
    });
    timeouts.push(setTimeout(()=>{
      if(finished) return;
      accepting = true;
      inputIdx = 0;
      statusEl.textContent = t("seqYourTurn");
    }, delay));
  }

  function nextRound(){
    round += 1;
    sequence.push(Math.floor(Math.random()*4));
    statusEl.textContent = t("seqRound", round);
    timeouts.push(setTimeout(playSequence, 700));
  }

  function endGame(){
    finished = true;
    accepting = false;
    clearTimers();
    const reached = round - 1; // 最后一关失败，已稳过的关数
    let stars = 0;
    if(reached >= 5) stars = 3; else if(reached >= 3) stars = 2; else if(reached >= 1) stars = 1;
    setTimeout(()=>showGameResult(card, stars, t("seqEnd", Math.max(reached,0))), 600);
  }

  pads.forEach(pad=>{
    pad.addEventListener("click", ()=>{
      if(!accepting || finished) return;
      const idx = parseInt(pad.dataset.pad,10);
      flash(idx, true);
      setTimeout(()=>flash(idx,false), 180);
      if(idx === sequence[inputIdx]){
        inputIdx += 1;
        if(inputIdx >= sequence.length){
          accepting = false;
          nextRound();
        }
      } else {
        statusEl.textContent = t("seqWrong");
        endGame();
      }
    });
  });

  nextRound();
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ===================== PWA：装到主屏、离线可用 ===================== */

let deferredInstall = null;

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* 不支持就当普通网页用 */ });
  });
}

function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
// 安卓/桌面等 beforeinstallprompt；iOS 只能手动添加，给出图文说明
function canInstall(){
  if(isStandalone()) return false;
  return !!deferredInstall || isIOS();
}

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  deferredInstall = e;
  renderTasks();
});
window.addEventListener("appinstalled", ()=>{
  deferredInstall = null;
  state.installDismissed = true;
  save(state);
  showToast({emoji:"🎉", msg:t("installedMsg"), sub:t("installedSub")});
  renderTasks();
});

async function doInstall(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  try{ await deferredInstall.userChoice; }catch(e){}
  deferredInstall = null;
  renderTasks();
}

/* ===================== 首页提示条 ===================== */

// 今天第一个还没完成的非休闲目标，用于「先做 5 分钟」一键开始
function firstOpenGoal(){
  for(const c of CATEGORIES){
    if(c.kind === "fun") continue;
    const g = (state.goals[c.id]||[]).find(x=>!x.done && (x.text||"").trim());
    if(g) return {catId:c.id, gid:g.id};
  }
  return null;
}

function buildBanners(){
  let html = "";
  // 今天还没开始 —— 温和地邀请，不施压
  if(!state.timer && todayPomos() === 0 && state.kickDismissed !== todayStr() && firstOpenGoal()){
    html += `<div class="kick">
      <span class="k-ic">🌤</span>
      <span class="k-txt">${t("kickTitle")}<small>${t("kickSub")}</small></span>
      <button class="k-go" data-kick-go>${t("kickGo")}</button>
      <button class="k-x" data-kick-x aria-label="close">✕</button>
    </div>`;
  }
  if(canInstall() && !state.installDismissed){
    const ios = isIOS();
    html += `<div class="kick install">
      <span class="k-ic">📲</span>
      <span class="k-txt">${t("installTitle")}<small>${ios ? t("installIosSub") : t("installSub")}</small></span>
      ${ios ? "" : `<button class="k-go" data-install>${t("installGo")}</button>`}
      <button class="k-x" data-install-x aria-label="close">✕</button>
    </div>`;
  }
  return html;
}

function bindBanners(el){
  const kickGo = el.querySelector("[data-kick-go]");
  if(kickGo) kickGo.addEventListener("click", ()=>{
    const g = firstOpenGoal();
    if(g) openStartSheet(g.catId, g.gid, STARTER_MIN);
  });
  const kickX = el.querySelector("[data-kick-x]");
  if(kickX) kickX.addEventListener("click", ()=>{
    state.kickDismissed = todayStr(); save(state); renderTasks();
  });
  const inst = el.querySelector("[data-install]");
  if(inst) inst.addEventListener("click", doInstall);
  const instX = el.querySelector("[data-install-x]");
  if(instX) instX.addEventListener("click", ()=>{
    state.installDismissed = true; save(state); renderTasks();
  });
}

/* ===================== 每日提醒 ===================== */

// 没有后端就没法做真正的定时推送。这里只在 App 还开着（哪怕在后台）时提醒；
// 没开着的话，用户下次打开会看到首页的开场提示 —— 界面里如实说明了这一点。
function checkReminder(){
  if(!state.reminder) return;
  const today = todayStr();
  if(state.remindedDate === today) return;
  if(todayPomos() > 0) return;               // 今天已经开始了，不打扰
  const [h, m] = state.reminder.split(":").map(Number);
  const now = new Date();
  if(now.getHours() < h || (now.getHours() === h && now.getMinutes() < m)) return;
  state.remindedDate = today;
  save(state);
  notify(t("remindNotifyTitle"), t("remindNotifyBody"));
}

/* ===================== 启动：恢复中断的专注段 ===================== */

// 关掉标签页 / 手机锁屏后重新打开时，把当时那一段补结算掉。
// 因为每段都有固定时长上限，绝不会出现"忘记停止 = 记了一整夜"的情况。
function resumeSession(){
  const tm = state.timer;
  if(!tm) return;
  const past = (Date.now() - tm.start)/1000;

  if(past >= tm.durSec){
    // 离开期间这一段已经跑完了
    if(tm.phase === "focus" || tm.phase === "fun"){
      const r = settleFocus(true);
      render();
      if(r && r.earnedPomo){
        popTomato(r.catId);
        showToast({emoji:"🍅", msg:t("pomoDone"), sub:t("pomoDoneSub", r.mins)});
      }
    } else {
      state.timer = null;
      save(state);
      render();
    }
    return;
  }
  // 还没跑完 → 回到全屏，继续倒计时
  openFocusScreen();
  startTicking();
}

// 从后台切回前台时立刻校准一次，避免手机休眠导致 setInterval 被节流
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  checkReminder();
  if(!state.timer) return;
  if(phaseRemain() <= 0){
    stopTicking();
    if(state.timer.phase === "focus") finishFocus();
    else if(state.timer.phase === "fun") finishFun();
    else finishBreak();
  } else {
    paintFocusScreen(null);
  }
});

render();
resumeSession();
checkReminder();
setInterval(checkReminder, 60000);
